# The personal-account tunnel's token: 1Password item cloudflare-tunnel-personal, field tunnel_token (vault phillips-homelab).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-personal-token
  namespace: cloudflare
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: cloudflare-tunnel-personal-token
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: cloudflare-tunnel-personal
      property: tunnel_token
