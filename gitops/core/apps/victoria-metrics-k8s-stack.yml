apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  project: default
  source:
    chart: victoria-metrics-k8s-stack
    repoURL: https://victoriametrics.github.io/helm-charts/
    targetRevision: 0.39.2
    helm:
      values: |
        alertmanager:
          # GLOBAL Alertmanager config (the base route tree the VM operator
          # merges every VMAlertmanagerConfig into). The chart default routes
          # the top-level catch-all to a null "blackhole" receiver, so any
          # alert without a matching per-namespace VMAlertmanagerConfig — etcd
          # (no namespace label), garage/storage PVCs, node/kube-system — was
          # silently dropped.
          #
          # Fix: point the top-level default receiver at ntfy's homelab-alerts
          # topic. Alertmanager posts its raw webhook JSON; ntfy's built-in
          # ?template=alertmanager formats it (title + summary + labels). Now
          # every unmatched cluster-level alert notifies instead of vanishing.
          # (Until 2026-10-07 this went through stock-bot-serve's /alerthook,
          # which formatted it the same way; stock-bot is gone.)
          #
          # The operator APPENDS each VMAlertmanagerConfig's route as a child
          # of this root (selectAllByDefault: true), so the existing
          # per-app routes (e.g. tycho, namespace=tycho)
          # keep working unchanged and are NOT duplicated here: an alert that
          # matches a child route is handled there and never reaches this
          # root receiver (Alertmanager only uses the root receiver when NO
          # child route matches). The one explicit child below re-blackholes
          # the always-firing Watchdog heartbeat and the InfoInhibitor so they
          # don't spam ntfy.
          config:
            route:
              receiver: ntfy-cluster
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 3h
              routes:
                - receiver: blackhole
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
            receivers:
              - name: blackhole
              - name: ntfy-cluster
                webhook_configs:
                  - url: "http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=alertmanager"
                    send_resolved: true
        kube-state-metrics:
          # Gateway API custom-resource metrics, for tls-alerts' GatewayConfigNotApplied:
          # spec generation vs the generation its controller (cilium-operator) has
          # applied. Added after the operator silently stopped reconciling Gateways
          # (2026-09-08 -> 2026-10-07). Standard KSM resources are unaffected.
          rbac:
            extraRules:
              - apiGroups: ["gateway.networking.k8s.io"]
                resources: ["gateways"]
                verbs: ["list", "watch"]
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind: {group: gateway.networking.k8s.io, version: v1, kind: Gateway}
                    metricNamePrefix: gateway_api_gateway
                    labelsFromPath:
                      name: [metadata, name]
                      namespace: [metadata, namespace]
                    metrics:
                      - name: generation
                        help: Gateway metadata.generation (the spec version the controller should apply)
                        each:
                          type: Gauge
                          gauge:
                            path: [metadata, generation]
                      - name: condition_observed_generation
                        help: observedGeneration on each Gateway status condition, as set by its controller
                        each:
                          type: Gauge
                          gauge:
                            path: [status, conditions]
                            labelsFromPath:
                              type: [type]
                            valueFrom: [observedGeneration]
        grafana:
          enabled: false
        defaultDashboards:
          enabled: true
          labels:
            key: grafana_dashboard
            value: true
          dashboards:
            victoriametrics-vmalert:
              enabled: true
            victoriametrics-operator:
              enabled: true
            node-exporter-full:
              enabled: true
        fullnameOverride: "vmstack"
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
