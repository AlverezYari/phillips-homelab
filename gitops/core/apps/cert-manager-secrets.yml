# cert-manager's Cloudflare DNS-01 token, from 1Password (item cloudflare-api-token,
# vault phillips-homelab). Was a hand-applied Secret until 2026-10-07: the token
# expired 2026-08-31 and nothing renewed for five weeks unnoticed. Now rotation is
# a 1Password edit (refreshes hourly), and tls-alerts pages long before expiry.
#
# The token is an *account* API token in Casey's personal Cloudflare account
# (Zone.Zone.Read + Zone.DNS.Edit on phillips-homelab.net). Verify it with
# /accounts/<id>/tokens/verify, not /user/tokens/verify (that always says invalid).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: cloudflare-api-token
    # Adopts the existing hand-made Secret of the same name (ESO sets itself as owner).
    creationPolicy: Owner
  data:
  - secretKey: api-token
    remoteRef:
      key: cloudflare-api-token
      property: api-token
