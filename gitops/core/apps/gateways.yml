      namespace: iso-lab
      port: 80
---
# MCP server for the ISO Market Data Lab (iso-lab/mcp-clickhouse). MCP's streamable
# HTTP can hold a response open for the length of a query (server caps queries at
# 30s), so the route timeout is raised above envoy's default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-14
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-14
    namespace: gateways
  hostnames:
  - iso-mcp.phillips-homelab.net
  rules:
  - backendRefs:
    - name: mcp-clickhouse
      namespace: iso-lab
      port: 80
    timeouts:
      request: 120s
---
# ISO Market Data Lab analysis MCP server (iso-lab/iso-analysis, runs under gVisor).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-15
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-15
    namespace: gateways
  hostnames:
  - iso-analysis.phillips-homelab.net
  rules:
  - backendRefs:
    - name: iso-analysis
      namespace: iso-lab
      port: 80
    timeouts:
      request: 120s
---
# miso-lab demo portal (miso-lab/gateway: tour + demo Grafana + read-only Dagster). Internal
# for now; going public later is a Cloudflare tunnel hostname + Access instead.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-16
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-16
    namespace: gateways
  hostnames:
  - miso-lab.phillips-homelab.net
  rules:
  - backendRefs:
    - name: gateway
      namespace: miso-lab
      port: 8080
    timeouts:
      request: 300s
---
# miso-ask: the miso-lab demo's "ask the data" chat (Open WebUI + Claude + iso-lab MCP servers).
# Internal for now. 600s: a chain of tool calls can keep one response streaming for minutes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-17
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-17
    namespace: gateways
  hostnames:
  - miso-ask.phillips-homelab.net
  rules:
  - backendRefs:
    - name: miso-ask
      namespace: miso-ask
      port: 8080
    timeouts:
      request: 600s
