---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gateway
  namespace: gateways
spec:
  gatewayClassName: cilium
  listeners:
  - name: https-1
    protocol: HTTPS
    port: 443
    hostname: argocd.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: argocd-tls
  - name: https-2
    protocol: HTTPS
    port: 443
    hostname: monitoring.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: monitoring-tls
  - name: https-3
    protocol: HTTPS
    port: 443
    hostname: zot.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: zot-tls
  - name: https-4
    protocol: HTTPS
    port: 443
    hostname: home-assistant.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: home-assistant-tls
  - name: https-5
    protocol: HTTPS
    port: 443
    hostname: jellyfin.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: jellyfin-tls
  - name: https-6
    protocol: HTTPS
    port: 443
    hostname: files.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: filebrowser-tls
  - name: https-7
    protocol: HTTPS
    port: 443
    hostname: openwebui.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: openwebui-tls
  - name: https-8
    protocol: HTTPS
    port: 443
    hostname: blocky.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: blocky-tls
  - name: https-9
    protocol: HTTPS
    port: 443
    hostname: phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: glance-tls
  - name: https-10
    protocol: HTTPS
    port: 443
    hostname: code.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: code-tls
  - name: https-13
    protocol: HTTPS
    port: 443
    hostname: dagster.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: dagster-tls
  - name: https-14
    protocol: HTTPS
    port: 443
    hostname: iso-mcp.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: iso-mcp-tls
  - name: https-15
    protocol: HTTPS
    port: 443
    hostname: iso-analysis.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: iso-analysis-tls
  - name: https-16
    protocol: HTTPS
    port: 443
    hostname: miso-lab.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: miso-lab-tls
  - name: https-17
    protocol: HTTPS
    port: 443
    hostname: miso-ask.phillips-homelab.net
    tls:
      certificateRefs:
      - kind: Secret
        name: miso-ask-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-1
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-1
  hostnames:
  - argocd.phillips-homelab.net
  rules:
  - backendRefs:
    - name: argocd-server
      namespace: argocd
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-2
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-2
    namespace: gateways
  hostnames:
  - monitoring.phillips-homelab.net
  rules:
  - backendRefs:
    - name: grafana
      namespace: monitoring
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-app-route-3
  namespace: gateways
spec:
  parentRefs:
  - name: tls-gateway
    sectionName: https-3
    namespace: gateways
  hostnames:
  - zot.phillips-homelab.net
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    - path:
        type: Exact
        value: /
    backendRefs:
    - name: zot-registry
      namespace: zot
      port: 5000
---
