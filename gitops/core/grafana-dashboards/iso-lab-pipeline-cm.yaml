apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-iso-lab-pipeline
  namespace: monitoring
  labels:
    grafana_dashboard: "true"
data:
  iso-lab-pipeline.json: |
    {
      "uid": "iso-lab-pipeline",
      "title": "ISO Lab: pipeline health",
      "description": "Is the iso-lab pipeline healthy, and is MISO publishing? Feed lag, polls, quarantined rows, report coverage, table sizes, cluster resources.",
      "tags": [
        "iso-lab"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "1m",
          "5m",
          "15m",
          "1h"
        ]
      },
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "links": [
        {
          "title": "Dagster",
          "type": "link",
          "url": "https://dagster.phillips-homelab.net",
          "targetBlank": true,
          "icon": "external link"
        },
        {
          "title": "iso-lab dashboards",
          "type": "dashboards",
          "tags": [
            "iso-lab"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Is MISO publishing? Real-time feeds (5-min polls)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "table",
          "id": 2,
          "title": "Real-time feeds: lag now",
          "description": "Per real-time mart: newest UTC interval start and how far it trails now (interval_lag_min), and when the last poll landed rows (since_last_load_min). Freshness check `data_freshness` fails at 20 min for lmp, hub_lmp, load, fuel_mix, interchange (yellow at 12 = the asset freshness warn window). An upstream stall (quirk #18) shows here as lmp/hub_lmp/constraints interval lag climbing while load/fuel_mix stay a few minutes; a stopped poller shows as since_last_load_min climbing for every feed. constraints: no rows when nothing binds (quirk #4), so its lag can be high legitimately. load_forecast uses snapshot_utc (forecast vintage); load_cleared holds future hours, so only its load time is shown. Marts, minutes. See docs/miso-quirks.md.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "table",
              "format": 1,
              "rawSql": "-- grafana-check: snapshot\nSELECT feed, newest_interval_utc,\n       if(feed = 'load_cleared', NULL, dateDiff('second', newest_interval_utc, now()) / 60) AS interval_lag_min,\n       last_loaded_utc, dateDiff('second', last_loaded_utc, now()) / 60 AS since_last_load_min\nFROM (\n  SELECT 'lmp' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.lmp\n  UNION ALL SELECT 'hub_lmp' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.hub_lmp\n  UNION ALL SELECT 'load' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.load\n  UNION ALL SELECT 'load_cleared' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.load_cleared\n  UNION ALL SELECT 'load_forecast' AS feed, max(snapshot_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.load_forecast\n  UNION ALL SELECT 'fuel_mix' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.fuel_mix\n  UNION ALL SELECT 'interchange' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.interchange\n  UNION ALL SELECT 'constraints' AS feed, max(interval_start_utc) AS newest_interval_utc, max(_loaded_at) AS last_loaded_utc FROM iso.constraints\n)\nORDER BY interval_lag_min DESC"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              },
              "decimals": 1
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "interval_lag_min"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "value": null,
                          "color": "green"
                        },
                        {
                          "value": 12,
                          "color": "yellow"
                        },
                        {
                          "value": 20,
                          "color": "red"
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "m"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "since_last_load_min"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "value": null,
                          "color": "green"
                        },
                        {
                          "value": 12,
                          "color": "yellow"
                        },
                        {
                          "value": 20,
                          "color": "red"
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "m"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "type": "timeseries",
          "id": 3,
          "title": "Interval lag at each poll (min)",
          "description": "At every poll: poll time minus the newest UTC interval start each feed has landed so far (staging, max per bucket). Healthy: lmp/hub_lmp ~2-7 min, load/fuel_mix ~7 min, interchange ~12 min. Quirk #18 (MISO LMP/constraint API stall, 2026-10-07): lmp and hub_lmp climb by 5 min per poll while load and fuel_mix stay flat. Red line = 20 min data_freshness limit. Staging tables, minutes. See docs/miso-quirks.md.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "timeseries",
              "format": 0,
              "rawSql": "WITH\n  feeds AS (\n    SELECT 'lmp' AS feed, _loaded_at, max(interval_start_utc) AS newest FROM iso.stg_miso__rt_lmp_5min WHERE _loaded_at >= $__fromTime - INTERVAL 1 DAY AND _loaded_at <= $__toTime GROUP BY _loaded_at\n    UNION ALL SELECT 'hub_lmp' AS feed, _loaded_at, max(interval_start_utc) AS newest FROM iso.stg_miso__hub_lmp_5min WHERE _loaded_at >= $__fromTime - INTERVAL 1 DAY AND _loaded_at <= $__toTime GROUP BY _loaded_at\n    UNION ALL SELECT 'load' AS feed, _loaded_at, max(interval_start_utc) AS newest FROM iso.stg_miso__load_actual_5min WHERE _loaded_at >= $__fromTime - INTERVAL 1 DAY AND _loaded_at <= $__toTime GROUP BY _loaded_at\n    UNION ALL SELECT 'fuel_mix' AS feed, _loaded_at, max(interval_start_utc) AS newest FROM iso.stg_miso__fuel_mix WHERE _loaded_at >= $__fromTime - INTERVAL 1 DAY AND _loaded_at <= $__toTime GROUP BY _loaded_at\n    UNION ALL SELECT 'interchange' AS feed, _loaded_at, max(interval_start_utc) AS newest FROM iso.stg_miso__interchange_nsi_5min WHERE _loaded_at >= $__fromTime - INTERVAL 1 DAY AND _loaded_at <= $__toTime GROUP BY _loaded_at\n  ),\n  -- newest interval landed so far, per feed, as of each of its loads\n  cum AS (SELECT feed, _loaded_at, max(newest) OVER (PARTITION BY feed ORDER BY _loaded_at ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS newest FROM feeds),\n  -- the poll clock: every load of any feed (a stalled feed lands nothing, the others still do)\n  polls AS (SELECT DISTINCT _loaded_at AS t FROM feeds WHERE $__timeFilter(_loaded_at)),\n  grid AS (SELECT t, feed FROM polls CROSS JOIN (SELECT DISTINCT feed FROM feeds) AS f)\nSELECT $__timeInterval(g.t) AS time, g.feed AS feed,\n       max(if(toYear(c._loaded_at) < 2000, NULL, dateDiff('second', c.newest, g.t) / 60)) AS lag_min\nFROM grid AS g ASOF LEFT JOIN cum AS c ON g.feed = c.feed AND g.t >= c._loaded_at\nGROUP BY time, feed\nORDER BY time"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "transparent"
                  },
                  {
                    "value": 20,
                    "color": "red"
                  }
                ]
              },
              "min": 0,
              "displayName": "${__field.labels.feed}"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 4,
          "title": "Rows landed in staging, real-time feeds",
          "description": "Rows each real-time staging table received, summed per time bucket (one poll every 5 min, so at <=5 min buckets this is rows per poll). rt_lmp_5min ~2,628 rows per new interval (all CPnodes); load/interchange re-send the whole day each poll, so they grow through the day. A feed dropping to nothing while others continue = upstream stall (quirk #18) or a dropped table. Staging (stg_miso__*), rows, log scale.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "timeseries",
              "format": 0,
              "rawSql": "SELECT $__timeInterval(_loaded_at) AS time, model, sum(n) AS rows FROM (\n  SELECT 'rt_lmp_5min' AS model, _loaded_at, count() AS n FROM iso.stg_miso__rt_lmp_5min WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'hub_lmp_5min' AS model, _loaded_at, count() AS n FROM iso.stg_miso__hub_lmp_5min WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'load_actual_5min' AS model, _loaded_at, count() AS n FROM iso.stg_miso__load_actual_5min WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'load_cleared_hourly' AS model, _loaded_at, count() AS n FROM iso.stg_miso__load_cleared_hourly WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'load_forecast_hourly' AS model, _loaded_at, count() AS n FROM iso.stg_miso__load_forecast_hourly WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'fuel_mix' AS model, _loaded_at, count() AS n FROM iso.stg_miso__fuel_mix WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'interchange_nsi_5min' AS model, _loaded_at, count() AS n FROM iso.stg_miso__interchange_nsi_5min WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n  UNION ALL SELECT 'binding_constraints' AS model, _loaded_at, count() AS n FROM iso.stg_miso__binding_constraints WHERE $__timeFilter(_loaded_at) GROUP BY _loaded_at\n)\nGROUP BY time, model\nORDER BY time"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "scaleDistribution": {
                  "type": "log",
                  "log": 10
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "displayName": "${__field.labels.model}"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Polls that landed rows",
          "description": "Distinct load times (_loaded_at) per bucket. Expected: one poll per 5 min (bucket width / 5 min). 'any feed' falling = the poller stopped (Dagster, code server, MISO down: check the Dagster UI and ntfy); 'polls with new LMP' falling alone = MISO stall (quirk #18). Staging, polls per bucket.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "timeseries",
              "format": 0,
              "rawSql": "SELECT $__timeInterval(_loaded_at) AS time,\n       uniqExact(_loaded_at) AS `polls landing rows (any feed)`,\n       uniqExactIf(_loaded_at, src = 'rt_lmp') AS `polls with new LMP`\nFROM (\n  SELECT 'fuel_mix' AS src, _loaded_at FROM iso.stg_miso__fuel_mix WHERE $__timeFilter(_loaded_at)\n  UNION ALL SELECT 'load', _loaded_at FROM iso.stg_miso__load_actual_5min WHERE $__timeFilter(_loaded_at)\n  UNION ALL SELECT 'rt_lmp', _loaded_at FROM iso.stg_miso__rt_lmp_5min WHERE $__timeFilter(_loaded_at)\n)\nGROUP BY time\nORDER BY time"
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "id": 6,
          "title": "Quarantined rows (iso.miso_rejects)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Quarantined rows in window",
          "description": "Staging rows with unparseable values (_parse_errors > 0) loaded in the time window. They are kept out of the marts, listed in iso.miso_rejects and alerted to ntfy by the quarantined_rows check; they don't fail the feed (CLAUDE.md rule 3). Rows.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "table",
              "format": 1,
              "rawSql": "SELECT count() AS rows FROM iso.miso_rejects WHERE $__timeFilter(_loaded_at)"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 4,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "orange"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Quarantined rows by model",
          "description": "iso.miso_rejects rows per time bucket by staging model, by load time (_loaded_at). Empty is healthy. Rows.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "timeseries",
              "format": 0,
              "rawSql": "-- grafana-check: allow-empty (no rejects is the normal state)\nSELECT $__timeInterval(_loaded_at) AS time, model, count() AS rows\nFROM iso.miso_rejects\nWHERE $__timeFilter(_loaded_at)\nGROUP BY time, model\nORDER BY time"
            }
          ],
          "gridPos": {
            "x": 4,
            "y": 19,
            "w": 10,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "displayName": "${__field.labels.model}"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "table",
          "id": 9,
          "title": "Recent rejects",
          "description": "Newest 200 quarantined rows in the window: model, entity (node / hub / category / constraint), UTC interval start, number of unparseable fields. The raw strings are in the lake; fix the parser in dbt staging, then `reprocess` (CLAUDE.md rules 1-4). Never edit ClickHouse rows.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "table",
              "format": 1,
              "rawSql": "-- grafana-check: allow-empty (no rejects is the normal state)\nSELECT _loaded_at AS loaded_utc, model, entity, interval_start_utc, _parse_errors AS bad_fields\nFROM iso.miso_rejects\nWHERE $__timeFilter(_loaded_at)\nORDER BY _loaded_at DESC\nLIMIT 200"
            }
          ],
          "gridPos": {
            "x": 14,
            "y": 19,
            "w": 10,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "type": "row",
          "id": 10,
          "title": "Daily reports and history (since 2026-07-01)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "table",
          "id": 11,
          "title": "Daily report marts: coverage since 2026-07-01",
          "description": "Per daily-report mart, market dates (EST, UTC-5 no DST; quirk #3/#11: keyed by the in-file date) present since 2026-07-01: count, newest, days behind today (EST), dates missing between 2026-07-01 and the newest (gaps a back-fill must fill), and dates with fewer than 24 hours. Normal: DA and RT prelim reports land at D+1, so days_behind 1-2 is expected. days_under_24h is expected for rt_binding_constraints (hours with nothing binding); for the LMP marts it means a partial file. Marts, days.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "table",
              "format": 1,
              "rawSql": "-- grafana-check: snapshot\nWITH toDate('2026-07-01') AS since, toDate(now() - INTERVAL 5 HOUR) AS today_est\nSELECT mart,\n       count() AS days_present,\n       max(d) AS newest_market_date,\n       dateDiff('day', max(d), today_est) AS days_behind,\n       arrayStringConcat(arrayMap(x -> toString(x), arrayFilter(x -> NOT has(groupArray(d), x), arrayMap(i -> since + i, range(toUInt32(dateDiff('day', since, max(d)) + 1))))), ', ') AS missing_days,\n       arrayStringConcat(arrayMap(x -> toString(x), arraySort(arrayFilter((x, h) -> h < 24, groupArray(d), groupArray(hours)))), ', ') AS days_under_24h\nFROM (\n  SELECT 'da_lmp_hourly' AS mart, toDate(interval_start_utc - INTERVAL 5 HOUR) AS d, uniqExact(toStartOfHour(interval_start_utc)) AS hours FROM iso.da_lmp_hourly WHERE interval_start_utc >= toDateTime(since, 'UTC') + INTERVAL 5 HOUR GROUP BY d\n  UNION ALL SELECT 'rt_lmp_hourly' AS mart, toDate(interval_start_utc - INTERVAL 5 HOUR) AS d, uniqExact(toStartOfHour(interval_start_utc)) AS hours FROM iso.rt_lmp_hourly WHERE interval_start_utc >= toDateTime(since, 'UTC') + INTERVAL 5 HOUR GROUP BY d\n  UNION ALL SELECT 'da_binding_constraints' AS mart, toDate(interval_start_utc - INTERVAL 5 HOUR) AS d, uniqExact(toStartOfHour(interval_start_utc)) AS hours FROM iso.da_binding_constraints WHERE interval_start_utc >= toDateTime(since, 'UTC') + INTERVAL 5 HOUR GROUP BY d\n  UNION ALL SELECT 'rt_binding_constraints' AS mart, toDate(interval_start_utc - INTERVAL 5 HOUR) AS d, uniqExact(toStartOfHour(interval_start_utc)) AS hours FROM iso.rt_binding_constraints WHERE interval_start_utc >= toDateTime(since, 'UTC') + INTERVAL 5 HOUR GROUP BY d\n)\nGROUP BY mart\nORDER BY mart"
            }
