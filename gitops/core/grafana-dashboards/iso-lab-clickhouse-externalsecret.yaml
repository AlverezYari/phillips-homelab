# The iso_ro ClickHouse password for Grafana (namespace monitoring). Same 1Password field
# the MCP servers use (iso-lab/clickhouse_ro_password): Grafana gets the read-only user only.
# Mounted as env var ISO_CLICKHOUSE_RO_PASSWORD (envFromSecrets, optional: true, so a broken
# sync leaves the datasource failing auth instead of Grafana failing to start); expanded by
# datasource-clickhouse.yaml. Vendored into gitops core/grafana-dashboards/.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-iso-clickhouse
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: grafana-iso-clickhouse
    creationPolicy: Owner
  data:
  - secretKey: ISO_CLICKHOUSE_RO_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_ro_password}
