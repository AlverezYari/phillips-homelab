apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-iso-lab-footprint
  namespace: monitoring
  labels:
    grafana_dashboard: "true"
data:
  iso-lab-footprint.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "uid": "iso-lab-footprint",
      "title": "ISO Lab: data footprint",
      "tags": [
        "iso-lab"
      ],
      "timezone": "utc",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "5m",
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Now",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Lake size",
          "description": "Bytes of raw Parquet in the Garage lake (bucket iso-market-data: raw/miso live feeds, raw/miso_reports history, raw/_quarantine, demo sandbox). Pushed by the export_pipeline_metrics sensor every 15 min.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(last_over_time(iso_lab_lake_bytes[20m]))",
              "legendFormat": "lake",
              "range": false,
              "instant": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Lake objects",
          "description": "Objects in the lake. Live polls add ~2,300/day; compact_lake (06:20 UTC) folds each settled day folder into one file.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(last_over_time(iso_lab_lake_objects[20m]))",
              "legendFormat": "objects",
              "range": false,
              "instant": true
            }
          ],
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "ClickHouse data",
          "description": "Bytes of all MergeTree tables (staging + marts, compressed on disk), from ClickHouse's own metrics (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables{namespace=\"iso-lab\"})",
              "legendFormat": "bytes",
              "range": false,
              "instant": true
            }
          ],
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "ClickHouse rows",
          "description": "Rows across all MergeTree tables (staging + marts).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(ClickHouseAsyncMetrics_TotalRowsOfMergeTreeTables{namespace=\"iso-lab\"})",
              "legendFormat": "rows",
              "range": false,
              "instant": true
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "ClickHouse disk used",
          "description": "data-clickhouse-0 PVC used / capacity (kubelet volume stats).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(kubelet_volume_stats_used_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"}) / max(kubelet_volume_stats_capacity_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"})",
              "legendFormat": "used",
              "range": false,
              "instant": true
            }
          ],
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "ClickHouse disk: days left",
          "description": "Free PVC space divided by the last 6 h's growth rate. A back-fill makes it briefly pessimistic; steady state is years. Shows 'No data' while growth is ~0.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(max(kubelet_volume_stats_capacity_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"}) - max(kubelet_volume_stats_used_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"})) / clamp_min(deriv(max(kubelet_volume_stats_used_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"})[6h]), 1) / 86400",
              "legendFormat": "days",
              "range": false,
              "instant": true
            }
          ],
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "row",
          "id": 8,
          "title": "Over time",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Lake bytes by prefix",
          "description": "iso_lab_lake_bytes per lake prefix (pushed every 15 min). The history back-fill shows as the raw/miso_reports step on 2026-10-08.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (prefix) (last_over_time(iso_lab_lake_bytes[20m]))",
              "legendFormat": "{{prefix}}",
              "range": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "Lake objects by prefix",
          "description": "iso_lab_lake_objects per prefix. raw/miso climbs ~2,300/day and steps down nightly once compaction has settled folders to fold.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (prefix) (last_over_time(iso_lab_lake_objects[20m]))",
              "legendFormat": "{{prefix}}",
              "range": true
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "ClickHouse data and disk",
          "description": "ClickHouse's MergeTree bytes vs the PVC's used bytes and capacity. The gap between data and used is parts awaiting merge, logs and system tables.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables{namespace=\"iso-lab\"})",
              "legendFormat": "table data",
              "range": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(kubelet_volume_stats_used_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"})",
              "legendFormat": "disk used",
              "range": true
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(kubelet_volume_stats_capacity_bytes{namespace=\"iso-lab\",persistentvolumeclaim=\"data-clickhouse-0\"})",
              "legendFormat": "disk capacity",
              "range": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "Growth per day",
          "description": "Rate of change over the trailing day, per store (bytes/day). Back-fills spike it; live ingestion alone is ~40 MiB/day in the lake.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "deriv(sum(last_over_time(iso_lab_lake_bytes[20m]))[1d:15m]) * 86400",
              "legendFormat": "lake",
              "range": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "deriv(max(ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables{namespace=\"iso-lab\"})[1d]) * 86400",
              "legendFormat": "ClickHouse data",
              "range": true
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "id": 13,
          "title": "By table (ClickHouse)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "table",
          "id": 14,
          "title": "Tables by size",
          "description": "Every iso table (system.tables, readable by iso_ro for granted tables), largest first. The hourly LMP marts and their staging tables dominate after the 2025 back-fill.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "iso-clickhouse"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "queryType": "table",
              "format": 1,
              "rawSql": "-- grafana-check: snapshot\nSELECT name AS \"table\", if(name LIKE 'stg_%', 'staging', 'mart') AS \"layer\",\n    total_rows AS \"rows\", total_bytes AS \"bytes on disk\"\nFROM system.tables\nWHERE database = 'iso' AND engine NOT LIKE '%View%'\nORDER BY total_bytes DESC\nLIMIT 40"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 12
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "fields": [
                "rows",
                "bytes_on_disk"
              ]
            }
          }
        }
      ],
      "templating": {
        "list": []
      },
      "links": [
        {
          "title": "Dagster",
          "type": "link",
          "url": "https://dagster.phillips-homelab.net",
          "targetBlank": true,
          "icon": "external link"
        },
        {
          "title": "iso-lab dashboards",
          "type": "dashboards",
          "tags": [
            "iso-lab"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "id": null
    }
