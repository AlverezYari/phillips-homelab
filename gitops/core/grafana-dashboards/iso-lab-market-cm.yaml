              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "pluginVersion": "4.14.0",
              "rawSql": "SELECT cpnode AS \"CPnode\",\n    round(avg(mcc), 2) AS \"Avg MCC\", round(min(mcc), 2) AS \"Min MCC\", round(max(mcc), 2) AS \"Max MCC\",\n    round(avg(lmp), 2) AS \"Avg LMP\", round(max(lmp), 2) AS \"Max LMP\", count() AS \"Intervals\"\nFROM lmp\nWHERE $__timeFilter(interval_start_utc)\nGROUP BY cpnode\nORDER BY avg(abs(mcc)) DESC\nLIMIT 20",
              "refId": "A"
