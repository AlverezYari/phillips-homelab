                "uid": "iso-clickhouse"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "pluginVersion": "4.14.0",
              "rawSql": "SELECT name AS \"Constraint\",\n    round(count() / 12, 1) AS \"Hours binding\",\n    round(min(shadow_price), 2) AS \"Min SP\",\n    round(avg(shadow_price), 2) AS \"Avg SP\",\n    round(sum(shadow_price) / 12, 0) AS \"\u03a3 SP \u00d7 h\",\n    any(curve_type) AS \"Curve\",\n    max(interval_start_utc) AS \"Last binding (UTC)\"\nFROM constraints\nWHERE $__timeFilter(interval_start_utc)\nGROUP BY name\nORDER BY sum(abs(shadow_price)) DESC\nLIMIT 20",
              "refId": "A"
