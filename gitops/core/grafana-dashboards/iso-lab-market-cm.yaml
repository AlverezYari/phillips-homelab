          "title": "Most congested CPnodes",
          "description": "lmp, 5-min intervals in the window, $/MWh: the 20 CPnodes with the largest average |MCC| (congestion component). Negative MCC = node relieved by congestion (cheaper).",
          "gridPos": {
            "h": 10,
