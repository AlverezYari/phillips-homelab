          "type": "table",
          "title": "Top binding constraints (RT)",
          "description": "constraints, 5-min, $/MWh: the 20 constraints with the largest total |shadow price| in the window. MISO sign: negative = binding cost. '\u03a3 SP \u00d7 h' = sum of shadow prices / 12 ($/MWh x hours). No row = not binding.",
