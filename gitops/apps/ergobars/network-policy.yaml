# Lockdown: ingress from the Cloudflare tunnel (cloudflared pods in the
# cloudflare namespace) on the nginx port, plus the board pod (it reads the
# download page for the addon version list). Egress is DNS and the board
# (nginx proxies /board and /api to it) -- declaring an egress section puts
# the pod in default-deny egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ergobars-site
  namespace: ergobars
spec:
  endpointSelector:
    matchLabels:
      app: ergobars-site
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare
            app: cloudflared
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # ergobars-board scrapes index.html for ErgoBars-*.zip (BOARD_SITE_URL).
    - fromEndpoints:
        - matchLabels:
            app: ergobars-board
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # /board, /setups and /api are proxied to ergobars-board.
    - toEndpoints:
        - matchLabels:
            app: ergobars-board
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
