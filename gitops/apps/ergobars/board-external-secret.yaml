# Board secrets, synced from the "ergobars" 1Password item via ESO. Fields:
#   typesafe-api-key   Jev key (unset in the app = mock mode, but required here)
#   board-admin-token  maintainer token for /board/admin?token=... -- a long
#                      random string; must exist before this syncs
#   turnstile-secret   not read by the board yet (phase 2 captcha)
# BOARD_SECRET is deliberately not set: the app generates one and keeps it in
# the db. Add a field + entry here if hashes must survive a db reset.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ergobars-board
  namespace: ergobars
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (see stock-bot ExternalSecrets).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: ergobars-board
    creationPolicy: Owner
  data:
  - secretKey: TYPESAFE_API_KEY
    remoteRef:
      key: ergobars
      property: typesafe-api-key
  - secretKey: BOARD_ADMIN_TOKEN
    remoteRef:
      key: ergobars
      property: board-admin-token
  - secretKey: TURNSTILE_SECRET
    remoteRef:
      key: ergobars
      property: turnstile-secret
