apiVersion: v1
kind: ServiceAccount
metadata:
  name: row-publisher
  namespace: publishers
---
# Long-lived token, filled in by the token controller. It does not expire;
# rotate by deleting this Secret (Argo recreates it with a new token) and
# rewriting ~/.kube/row-publisher.yaml. See README.md.
apiVersion: v1
kind: Secret
metadata:
  name: row-publisher-token
  namespace: publishers
  annotations:
    kubernetes.io/service-account.name: row-publisher
type: kubernetes.io/service-account-token
