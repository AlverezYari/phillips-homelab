# ErgoBars `make publish` (kubectl cp into ergobars-site/uploader:/srv/site)
# and `make announce` (reads BOARD_ADMIN_TOKEN). The site pod name is
# generated by its Deployment, so pods and pods/exec cannot be pinned by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: row-publisher
  namespace: ergobars
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ergobars-board"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: row-publisher
  namespace: ergobars
subjects:
  - kind: ServiceAccount
    name: row-publisher
    namespace: publishers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: row-publisher
