apiVersion: apps/v1
kind: Deployment
metadata:
  name: tychofleet
  namespace: tychofleet
  labels:
    app: tychofleet
spec:
  replicas: 1
  # Single SQLite writer — same constraint as light-the-ham.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tychofleet
  template:
    metadata:
      labels:
        app: tychofleet
    spec:
      # fleetsync-rbac.yaml's SA: lets the site write DeliveryTarget
      # CRs/Secrets into the tycho namespace (tychofleet #65). Without
      # it the storage page saves but shows "not materialized".
      serviceAccountName: tychofleet-fleetsync
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: zot.phillips-homelab.net/tychofleet:314cc03
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4321
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
            - name: DATABASE_PATH
              value: /data/tychofleet.db
            - name: SMTP_HOST
              value: smtp.fastmail.com
            - name: SMTP_PORT
              value: "587"
            # Fastmail SMTP AUTH needs the account login, not the sending
            # identity — admin@tychofleet.com is an alias and 535s.
            - name: SMTP_USER
              value: devs@lighttheham.com
            - name: SMTP_FROM
              value: admin@tychofleet.com
            # Per-fleet backup/sync admin UI (tychofleet #65). The
            # in-cluster k8s client reads the SA token Kubernetes
            # projects into the pod; TYCHO_NAMESPACE is where the
            # DeliveryTarget/Secret pairs land. Managed-storage mode's
            # non-secret half lives here; the key pair arrives via
            # tychofleet-config (ESO), reading the SAME tycho-item
            # fields as the operator's tycho-delivery-b2 Secret so the
            # two sides can never drift.
            - name: TYCHO_NAMESPACE
              value: "tycho"
            - name: MANAGED_STORAGE_ENDPOINT
              value: "https://s3.us-east-005.backblazeb2.com"
            - name: MANAGED_STORAGE_REGION
              value: "us-east-005"
            - name: MANAGED_STORAGE_BUCKET
              value: "tf-fleet-bak-01"
            - name: GARAGE_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: GARAGE_BUCKET
              value: "tycho"
            - name: PROVISIONER
              # Selects the Tailscale auth-key provisioner for the legacy
              # waitlist/approve invite path. There is deliberately NO
              # default any more: it used to fall back to a fake that
              # minted tskey-fake-000001, which the approve flow then
              # emailed as a working invite — every screen reported
              # success and the member's agent silently never joined.
              # The app now throws at startup if this is unset, so this
              # line is load-bearing.
              value: "tailscale"
            - name: TYCHO_GATEWAY_PUBLIC_URL
              # The address a MEMBER'S OWN MACHINE reaches, written into
              # the tycho.yaml they download — distinct from
              # TYCHO_GATEWAY_URL below, which is in-cluster DNS and
              # means nothing off-cluster. Sending the wrong one is
              # exactly how a real member got "couldn't reach
              # http://tycho-gateway.tycho.svc.cluster.local".
              #
              # The gateway is published ONLY on the fleet tailnet, so
              # this is a tailnet name: not public DNS, not a LAN
              # address. The client joins that tailnet in-process (tsnet)
              # using the key the site mints, so the member's machine
              # needs no Tailscale of its own.
              value: "https://tycho-gateway.tail92d9b0.ts.net"
            - name: TS_TAILNET
              # "-" resolves to the OAuth client's own tailnet, so the
              # fleet tailnet name is not duplicated here.
              value: "-"
            - name: TYCHO_GATEWAY_URL
              # ADR 0009: the site calls the gateway's /v1/scopes API to
              # add a scope, mint a one-time setup code, rename and
              # remove. SITE_API_TOKEN arrives via envFrom below.
              # In-cluster only; the network policy scopes egress to the
              # gateway pods, not the whole namespace.
              value: "http://tycho-gateway.tycho.svc.cluster.local"
          # SMTP_PASS, SESSION_SECRET, ADMIN_TOKEN, CATALOG_DSN,
          # GARAGE_ACCESS_KEY_ID, GARAGE_SECRET_ACCESS_KEY
          envFrom:
            - secretRef:
                name: tychofleet-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
        # Litestream sidecar: continuous SQLite replication to B2 —
        # the site DB (waitlist/members/fleet-storage settings) was
        # the last un-backed-up state in the system. Same bucket as
        # the archive mirror, its own prefix; creds are the existing
        # LITESTREAM_GARAGE_* keys from tychofleet-config (ESO) — replicates
        # to in-cluster Garage (the pod has no internet egress, so the old
        # B2 target failed continuously). RWO PVC is fine: sidecar shares
        # the app's pod.
        - name: litestream
          image: litestream/litestream:0.3.13
          args: ["replicate", "-config", "/etc/litestream.yml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tychofleet-config
                  key: LITESTREAM_GARAGE_ACCESS_KEY_ID
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tychofleet-config
                  key: LITESTREAM_GARAGE_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tychofleet-data
        - name: litestream-config
          configMap:
            name: tychofleet-litestream
