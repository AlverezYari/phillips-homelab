apiVersion: apps/v1
kind: Deployment
metadata:
  name: tychofleet
  namespace: tychofleet
  labels:
    app: tychofleet
spec:
  replicas: 1
  # Single SQLite writer — same constraint as light-the-ham.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tychofleet
  template:
    metadata:
      labels:
        app: tychofleet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: zot.phillips-homelab.net/tychofleet:8afcaeb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4321
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
            - name: DATABASE_PATH
              value: /data/tychofleet.db
            - name: SMTP_HOST
              value: smtp.fastmail.com
            - name: SMTP_PORT
              value: "587"
            # Fastmail SMTP AUTH needs the account login, not the sending
            # identity — admin@tychofleet.com is an alias and 535s.
            - name: SMTP_USER
              value: devs@lighttheham.com
            - name: SMTP_FROM
              value: admin@tychofleet.com
            - name: GARAGE_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: GARAGE_BUCKET
              value: "tycho"
          # SMTP_PASS, SESSION_SECRET, ADMIN_TOKEN, CATALOG_DSN,
          # GARAGE_ACCESS_KEY_ID, GARAGE_SECRET_ACCESS_KEY
          envFrom:
            - secretRef:
                name: tychofleet-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tychofleet-data
