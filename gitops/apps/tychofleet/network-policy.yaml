# Lockdown: ingress only from the Cloudflare tunnel; egress DNS, SMTP
# submission (Fastmail, magic-link mail) and the Tycho catalog. Litestream
# phase 3 will need an egress rule to garage:3900 like lighttheham's.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tychofleet
  namespace: tychofleet
spec:
  endpointSelector:
    matchLabels:
      app: tychofleet
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare
      toPorts:
        - ports:
            - port: "4321"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # smtp.fastmail.com submission. Port-scoped world egress rather than
    # toFQDNs — nothing in the cluster uses the Cilium DNS proxy yet and
    # this deploy is the wrong place to introduce it.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
    # api.tailscale.com, for minting each member a one-time tag:scope
    # auth key at enrolment (ADR 0009 / fleet tailnet). Without this the
    # egress lockdown blocks the mint and setup fails at the moment a
    # member clicks — the site is otherwise entirely healthy, which is
    # the failure shape this project keeps hitting.
    #
    # toEntities: world rather than toFQDNs because nothing in this
    # cluster runs the Cilium DNS proxy yet, matching the note above.
    # That means 443 to the internet generally, not just Tailscale —
    # narrow it to a toFQDNs rule if the DNS proxy is ever enabled.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The Tycho catalog (CATALOG_DSN -> tycho-pg-r). Every attribution
    # number the site shows -- pooled integration, campaign totals, a
    # master's per-source seconds, a scope's last heartbeat -- is read
    # from here; without this rule the catalog client times out and every
    # one of those panels renders its "not wired" empty state, which is
    # indistinguishable from having no data. Scoped to the CNPG instance
    # pods in the tycho namespace on 5432, not the whole namespace.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tycho
            cnpg.io/cluster: tycho-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Garage's S3 API, for the master preview JPEG and the FITS download
    # (/fleet/{slug}/master-preview.jpg, master-download.fit). Reads are
    # SigV4-signed; the site holds a Garage key pair, so this rule alone
    # grants nothing without those credentials. Scoped to the Garage
    # pods, not the whole namespace.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    # ADR 0009: the scope-management API (add a scope, mint a setup
    # code, rename, remove). Without this rule the egress lockdown
    # silently blocks every scope action and the deck renders as though
    # the member simply has no scopes — a plausible-looking empty state,
    # which is how this project's worst bugs have always presented.
    # Scoped to the gateway pods, not the whole tycho namespace.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tycho
            app.kubernetes.io/name: tycho-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
