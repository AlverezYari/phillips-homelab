# App secret for tychofleet, synced from the "tychofleet" 1Password item via
# ESO. SMTP_PASS is a Fastmail app password (not the account login password).
# One secret, many keys — add fields to the 1P item and a matching data entry
# here as the app grows (tycho-config pattern).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tychofleet-config
  namespace: tychofleet
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (see stock-bot ExternalSecrets).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: tychofleet-config
    creationPolicy: Owner
  data:
  - secretKey: SMTP_PASS
    remoteRef:
      key: tychofleet
      property: SMTP_PASS
  - secretKey: SESSION_SECRET
    remoteRef:
      key: tychofleet
      property: SESSION_SECRET
  - secretKey: ADMIN_TOKEN
    remoteRef:
      key: tychofleet
      property: ADMIN_TOKEN
  # Read-only view of the Tycho catalog. Absent -> the site's catalog
  # client returns "not-wired" and every attribution panel renders empty,
  # which reads exactly like having no data yet.
  - secretKey: CATALOG_DSN
    remoteRef:
      key: tychofleet
      property: CATALOG_DSN
  # Garage S3 key pair for reading master previews and FITS objects.
  # Read-only would be better than reusing the pipeline's write key;
  # see PR body.
  - secretKey: GARAGE_ACCESS_KEY_ID
    remoteRef:
      key: tychofleet
      property: GARAGE_ACCESS_KEY_ID
  # ADR 0009: the site's service credential for the gateway's
  # /v1/scopes API (add a scope, mint a setup code, rename, remove).
  # Deliberately read from the `tycho` 1Password item, the same field
  # the gateway's own ExternalSecret reads, so the two sides cannot
  # drift apart the way two copies of one secret always eventually do.
  - secretKey: SITE_API_TOKEN
    remoteRef:
      key: tycho
      property: SITE_API_TOKEN
  # ADR 0009 / fleet tailnet: the site mints each member a one-time,
  # tag:scope, pre-authorized Tailscale key so their client can join the
  # fleet tailnet and reach the gateway. This OAuth client is scoped to
  # auth_keys ONLY and carries tag:scope-minter — deliberately a
  # different client from the Kubernetes operator's, so the site can
  # issue keys and can never touch devices.
  - secretKey: TS_MINTER_CLIENT_ID
    remoteRef:
      key: tycho
      property: fleet_ts_minter_client_id
  - secretKey: TS_MINTER_CLIENT_SECRET
    remoteRef:
      key: tycho
      property: fleet_ts_minter_client_secret
  - secretKey: GARAGE_SECRET_ACCESS_KEY
    remoteRef:
      key: tychofleet
      property: GARAGE_SECRET_ACCESS_KEY
  # "TychoFleet Managed Storage" (per-fleet sync, tychofleet #65):
  # deliberately read from the `tycho` item's B2 delivery fields — the
  # same properties the operator-side tycho-delivery-b2 ExternalSecret
  # reads (SITE_API_TOKEN no-drift pattern).
  - secretKey: MANAGED_STORAGE_ACCESS_KEY_ID
    remoteRef:
      key: tycho
      property: b2_delivery_key_id
  - secretKey: MANAGED_STORAGE_SECRET_ACCESS_KEY
    remoteRef:
      key: tycho
      property: b2_delivery_application_key
  # Litestream backup of the site DB (member accounts, scopes, setup
  # codes) to the in-cluster Garage bucket tychofleet-backups. Replaces
  # the B2 target, which the pod cannot reach (no egress) — the B2
  # replica was failing continuously. Key is scoped RW to that one
  # bucket. Its own 1Password item (like atuin-garage-backup), not the
  # shared tychofleet/tycho items.
  - secretKey: LITESTREAM_GARAGE_ACCESS_KEY_ID
    remoteRef:
      key: tychofleet-garage-backup
      property: access_key_id
  - secretKey: LITESTREAM_GARAGE_SECRET_ACCESS_KEY
    remoteRef:
      key: tychofleet-garage-backup
      property: secret_access_key
