# App secret for tychofleet, synced from the "tychofleet" 1Password item via
# ESO. SMTP_PASS is a Fastmail app password (not the account login password).
# One secret, many keys — add fields to the 1P item and a matching data entry
# here as the app grows (tycho-config pattern).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tychofleet-config
  namespace: tychofleet
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (see stock-bot ExternalSecrets).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: tychofleet-config
    creationPolicy: Owner
  data:
  - secretKey: SMTP_PASS
    remoteRef:
      key: tychofleet
      property: SMTP_PASS
  - secretKey: SESSION_SECRET
    remoteRef:
      key: tychofleet
      property: SESSION_SECRET
  - secretKey: ADMIN_TOKEN
    remoteRef:
      key: tychofleet
      property: ADMIN_TOKEN
  # Read-only view of the Tycho catalog. Absent -> the site's catalog
  # client returns "not-wired" and every attribution panel renders empty,
  # which reads exactly like having no data yet.
  - secretKey: CATALOG_DSN
    remoteRef:
      key: tychofleet
      property: CATALOG_DSN
  # Garage S3 key pair for reading master previews and FITS objects.
  # Read-only would be better than reusing the pipeline's write key;
  # see PR body.
  - secretKey: GARAGE_ACCESS_KEY_ID
    remoteRef:
      key: tychofleet
      property: GARAGE_ACCESS_KEY_ID
  - secretKey: GARAGE_SECRET_ACCESS_KEY
    remoteRef:
      key: tychofleet
      property: GARAGE_SECRET_ACCESS_KEY
