# The server's own test account, mounted as the FILE /src/row-server/.server-account in the login
# probe (jobs/probe-login.yaml, subPath .server-account). Key the pod expects: .server-account
# (with the leading dot; the whole file content is one 1Password field).
# TODO(owner): the 1Password item and property names below are PLACEHOLDERS. Put the value of the
# hand-made Secret that runs today into 1Password first, so nothing changes when ESO takes it over.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: row-server-account
  namespace: row-realm
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (ESO post-admission defaults; see the ignoreDifferences in tools/apps/iso-lab.yml).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: row-server-account
    creationPolicy: Owner
  data:
  - secretKey: .server-account
    remoteRef:
      key: TODO-owner-row-server-account            # TODO(owner): 1Password item name
      property: TODO-owner-server-account    # TODO(owner): field name in that item
