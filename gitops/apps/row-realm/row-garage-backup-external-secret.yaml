# Garage S3 key for the database backups: the CNPG ObjectStore row-pg-backups (pg.yaml: WAL archive
# and base backups, bucket row-pg-backups) and the upload step of CronJob row-pg-dump (backup.yaml,
# bucket row-pg-dumps). Keys expected: ACCESS_KEY_ID, ACCESS_SECRET_KEY, region.
# TODO(owner): the 1Password item and property names below are PLACEHOLDERS (the pattern is
# tools/apps/atuin/externalsecret.yaml). `region` is not a secret; atuin's static value is copied
# here. TODO(owner): confirm the hand-made Secret's region says the same before turning this on.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: row-garage-backup
  namespace: row-realm
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (ESO post-admission defaults; see the ignoreDifferences in tools/apps/iso-lab.yml).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: row-garage-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        region: garage
  data:
  - secretKey: ACCESS_KEY_ID
    remoteRef:
      key: TODO-owner-row-garage-backup          # TODO(owner): 1Password item name
      property: TODO-owner-access_key_id         # TODO(owner): field name in that item
  - secretKey: ACCESS_SECRET_KEY
    remoteRef:
      key: TODO-owner-row-garage-backup          # TODO(owner): 1Password item name
      property: TODO-owner-secret_access_key     # TODO(owner): field name in that item
