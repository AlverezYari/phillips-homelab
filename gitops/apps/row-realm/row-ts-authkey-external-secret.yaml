# Tailscale auth key for the realm pod's sidecar (realm.yaml, container tailscale, env TS_AUTHKEY).
# Only used when the device has no state: the node key lives in Secret row-realm3-ts-state, which
# the sidecar writes itself. Key the pod expects: TS_AUTHKEY.
# TODO(owner): the 1Password item and property names below are PLACEHOLDERS. Put the value of the
# hand-made Secret that runs today into 1Password first, so nothing changes when ESO takes it over.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: row-ts-authkey
  namespace: row-realm
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (ESO post-admission defaults; see the ignoreDifferences in tools/apps/iso-lab.yml).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: row-ts-authkey
    creationPolicy: Owner
  data:
  - secretKey: TS_AUTHKEY
    remoteRef:
      key: TODO-owner-row-ts-authkey            # TODO(owner): 1Password item name
      property: TODO-owner-ts-authkey    # TODO(owner): field name in that item
