# Password of the sim accounts (sims.yaml, both containers, env ROW_SIM_PASS).
# Key the pods expect: ROW_SIM_PASS.
# TODO(owner): the 1Password item and property names below are PLACEHOLDERS. Put the value of the
# hand-made Secret that runs today into 1Password first, so nothing changes when ESO takes it over.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: row-sim-pass
  namespace: row-realm
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (ESO post-admission defaults; see the ignoreDifferences in tools/apps/iso-lab.yml).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: row-sim-pass
    creationPolicy: Owner
  data:
  - secretKey: ROW_SIM_PASS
    remoteRef:
      key: TODO-owner-row-sim-pass            # TODO(owner): 1Password item name
      property: TODO-owner-sim-pass    # TODO(owner): field name in that item
