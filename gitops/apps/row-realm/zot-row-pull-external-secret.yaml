# Image pull login for zot.phillips-homelab.net/row/* (realm.yaml, imagePullSecrets of the realm pod).
# The Secret must stay type kubernetes.io/dockerconfigjson with the one key .dockerconfigjson
# (same template as apps/esmh/external-secret.yaml).
# TODO(owner): the 1Password item and property names below are PLACEHOLDERS. Use the login the
# hand-made Secret holds today. (zot.yml lets anyone read, so the pull may work without it; the
# pod still names the Secret, so it is kept as it runs.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zot-row-pull
  namespace: row-realm
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (ESO post-admission defaults; see the ignoreDifferences in tools/apps/iso-lab.yml).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: zot-row-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"zot.phillips-homelab.net":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: TODO-owner-zot-row-pull       # TODO(owner): 1Password item name
      property: TODO-owner-username      # TODO(owner): field name in that item
  - secretKey: password
    remoteRef:
      key: TODO-owner-zot-row-pull       # TODO(owner): 1Password item name
      property: TODO-owner-password      # TODO(owner): field name in that item
