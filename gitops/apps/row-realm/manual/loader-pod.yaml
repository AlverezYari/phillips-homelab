# MANUAL, not in kustomization.yaml, so Argo never applies it: apply by hand only when refilling
# the game-data volume, delete it afterwards.
# One-shot loader: mount the PVC read-write, sleep, and let the desktop pipe the data in
# (RoW's scripts/game-data-copy.sh prints the exact commands):
#   tar -C <desktop paths> -cf - … | kubectl -n row-realm exec -i row-game-loader -- tar -xf - -C /vol
#   kubectl -n row-realm exec row-game-loader -- sha256sum -c /vol/MANIFEST.sha256
#   kubectl -n row-realm delete pod row-game-loader
apiVersion: v1
kind: Pod
metadata:
  namespace: row-realm
  name: row-game-loader
  labels:
    app.kubernetes.io/name: loader
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: homelab-04   # the realm's node (RWO PVC)
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
      volumeMounts:
        - name: data
          mountPath: /vol
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: row-game-data
