# Upload token of the release server (realm.yaml, container row-serve, env ROW_DIST_UPLOAD_TOKEN;
# used by RoW's bin/row-dist-upload --via tailnet). Key the pod expects: token.
# TODO(owner): the 1Password item and property names below are PLACEHOLDERS. Put the value of the
# hand-made Secret that runs today into 1Password first, so nothing changes when ESO takes it over.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: row-dist-upload-token
  namespace: row-realm
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (ESO post-admission defaults; see the ignoreDifferences in tools/apps/iso-lab.yml).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: row-dist-upload-token
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: TODO-owner-row-dist-upload-token            # TODO(owner): 1Password item name
      property: TODO-owner-token    # TODO(owner): field name in that item
