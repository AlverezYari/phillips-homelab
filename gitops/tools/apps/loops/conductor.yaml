# In-cluster loop conductor: chains a queue of already-written specs (spawn ->
# loop done -> reap -> mechanical review Job -> merge exactly the reviewed sha
# -> spawn next) so loops keep running with no Claude session attached. Any
# halt pings the phone and stops the chain. Code and queues are runtime
# ConfigMaps pushed by loops/conductor/conductor-ctl.sh; see loops/conductor/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loop-conductor
  namespace: loops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loop-conductor
  namespace: loops
rules:
# loopctl spawn/reap
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
# loopctl helper pods, spawn's SPEC upload (kubectl cp = exec), review logs
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
# conductor-<chain> state, queue-<chain>, loop-conductor-code
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "patch", "update"]
# review Jobs
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loop-conductor
  namespace: loops
subjects:
- kind: ServiceAccount
  name: loop-conductor
  namespace: loops
roleRef:
  kind: Role
  name: loop-conductor
  apiGroup: rbac.authorization.k8s.io
# No chain CronJobs are running. Corten's was removed 2026-11-06 because the
# chain has been halted since 2026-10-11; its conductor-corten and queue-corten
# ConfigMaps are kept. To resume, revert the commit that removed it.
