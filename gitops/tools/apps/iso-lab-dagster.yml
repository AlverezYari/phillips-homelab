apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iso-lab-dagster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: iso-lab
  annotations:
    # Ordering intent: iso-lab-pg (wave 0), iso-lab-env + ClickHouse (wave 1). argocd-cm
    # has no Application health check, so waves don't gate; init containers and ESO
    # retries cover the gap on first sync.
    argocd.argoproj.io/sync-wave: "2"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: iso-lab
  project: default
  source:
    repoURL: https://dagster-io.github.io/helm
    chart: dagster
    # Keep in step with the dagster version pinned in iso-market-data-lab's uv.lock.
    targetRevision: "1.13.25"
    helm:
      releaseName: dagster
      values: |-
        global:
          postgresqlSecretName: iso-lab-pg
        generatePostgresqlPasswordSecret: false
        postgresql:
          enabled: false
          postgresqlHost: iso-lab-pg-rw
          postgresqlUsername: dagster
          postgresqlDatabase: dagster
          service:
            port: 5432

        # Runs execute in the code-server pod (DefaultRunLauncher) instead of
        # a Job per run: the feeds are small HTTP pulls every few minutes, and
        # a pod per run would be ~60 pod starts an hour for no isolation we need.
        runLauncher:
          type: CustomRunLauncher
          config:
            customRunLauncher:
              module: dagster._core.launcher
              class: DefaultRunLauncher
              config: {}

        dagsterWebserver:
          replicaCount: 1
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          # Chart image runs as root by default; verified non-root + read-only root with
          # only /tmp writable (webserver serves UI/GraphQL, daemon ticks automation).
          # Init containers (check-db-ready, init-user-deployment) inherit securityContext.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        dagsterDaemon:
          enabled: true
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          # Chart image runs as root by default; verified non-root + read-only root with
          # only /tmp writable (webserver serves UI/GraphQL, daemon ticks automation).
          # Init containers (check-db-ready, init-user-deployment) inherit securityContext.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          runRetries:
            enabled: true
            maxRetries: 1
          runCoordinator:
            enabled: true
            type: QueuedRunCoordinator

        # Pools: `miso_ingest` (dlt) and `clickhouse_dbt` (dbt) each run one at a
        # time, so a slow MISO poll can't overlap the next and race on dlt state.
        # (With a concurrency block, Dagster requires the run limit here, not under
        # runCoordinator.config; setting both stops the daemon and webserver starting.)
        concurrency:
          enabled: true
          pools:
            defaultLimit: 1
          runs:
            # Every run is a subprocess of the one code-server pod (DefaultRunLauncher),
            # so keep this low enough not to OOM it.
            maxConcurrentRuns: 3

        telemetry:
          enabled: false

        dagster-user-deployments:
          enabled: true
          enableSubchart: true
          deployments:
            - name: iso-lab
              image:
                repository: zot.phillips-homelab.net/iso-lab
                tag: "9e5642b"   # bump to deploy a new build (and iso-lab/kustomization.yaml images:)
                pullPolicy: IfNotPresent
              dagsterApiGrpcArgs: ["-m", "iso_lab.definitions"]
              port: 4000
              envSecrets:
                - name: iso-lab-env
              env:
                - {name: LAKE_S3_ENDPOINT, value: "http://garage.garage.svc:3900"}
                - {name: LAKE_BUCKET, value: iso-market-data}
                - {name: CLICKHOUSE_HOST, value: clickhouse}
                # Explicit, because Kubernetes injects CLICKHOUSE_PORT=tcp://<ip>:8123 for the
                # `clickhouse` Service (service links), which the code and dbt profile read.
                - {name: CLICKHOUSE_PORT, value: "8123"}
                - {name: CLICKHOUSE_USER, value: iso}
                - {name: ALERT_NTFY_URL, value: "http://ntfy.stock-bot.svc.cluster.local/iso-lab"}
                - {name: DAGSTER_UI_URL, value: "https://dagster.phillips-homelab.net"}
              # The chart points DAGSTER_HOME here without mounting anything in this pod;
              # runs execute here (DefaultRunLauncher) and write step storage under it.
              volumes:
                - name: dagster-home
                  emptyDir: {sizeLimit: 1Gi}
              volumeMounts:
                - name: dagster-home
                  mountPath: /opt/dagster/dagster_home
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 2Gi}
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile: {type: RuntimeDefault}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              labels:
                iso-lab/role: ingest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
