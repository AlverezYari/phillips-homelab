apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iso-lab-dagster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: iso-lab
  annotations:
    # Ordering intent: iso-lab-pg (wave 0), iso-lab-env + ClickHouse (wave 1). argocd-cm
    # has no Application health check, so waves don't gate; init containers and ESO
    # retries cover the gap on first sync.
    argocd.argoproj.io/sync-wave: "2"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: iso-lab
  project: default
  source:
    repoURL: https://dagster-io.github.io/helm
    chart: dagster
    # Keep in step with the dagster version pinned in iso-market-data-lab's uv.lock.
    targetRevision: "1.13.25"
    helm:
      releaseName: dagster
      values: |-
        global:
          postgresqlSecretName: iso-lab-pg
        generatePostgresqlPasswordSecret: false
        postgresql:
          enabled: false
          postgresqlHost: iso-lab-pg-rw
          postgresqlUsername: dagster
          postgresqlDatabase: dagster
          service:
            port: 5432

        # Runs execute in the code-server pod (DefaultRunLauncher) instead of
        # a Job per run: the feeds are small HTTP pulls every few minutes, and
        # a pod per run would be ~60 pod starts an hour for no isolation we need.
        runLauncher:
          type: CustomRunLauncher
          config:
            customRunLauncher:
              module: dagster._core.launcher
              class: DefaultRunLauncher
              config: {}

        dagsterWebserver:
          replicaCount: 1
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          # Chart image runs as root by default; verified non-root + read-only root with
          # only /tmp writable (webserver serves UI/GraphQL, daemon ticks automation).
          # Init containers (check-db-ready, init-user-deployment) inherit securityContext.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        dagsterDaemon:
          enabled: true
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          # Chart image runs as root by default; verified non-root + read-only root with
          # only /tmp writable (webserver serves UI/GraphQL, daemon ticks automation).
          # Init containers (check-db-ready, init-user-deployment) inherit securityContext.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          runRetries:
            enabled: true
            maxRetries: 1
          runCoordinator:
            enabled: true
            type: QueuedRunCoordinator

        # Pools: `miso_ingest` (dlt) and `clickhouse_dbt` (dbt) each run one at a
        # time, so a slow MISO poll can't overlap the next and race on dlt state.
        # (With a concurrency block, Dagster requires the run limit here, not under
        # runCoordinator.config; setting both stops the daemon and webserver starting.)
        concurrency:
          enabled: true
          pools:
            defaultLimit: 1
          runs:
            # Every run is a subprocess of the one code-server pod (DefaultRunLauncher),
            # so keep this low enough not to OOM it.
            maxConcurrentRuns: 3
            # A history back-fill queues hundreds of runs; one at a time leaves the other
            # slots for the live 5-min polls (and MISO gets one report request at a time).
            tagConcurrencyLimits:
              - key: dagster/backfill
                limit: 1

        telemetry:
          enabled: false

        # Schedule/sensor/automation tick history (runs themselves are purged by the
        # run_retention job in the code location, 14 days).
        retention:
          enabled: true
          schedule:
            purgeAfterDays: 14
          sensor:
            purgeAfterDays: {failure: 14, skipped: 2, started: 14, success: 14}
          autoMaterialize:
            purgeAfterDays: {failure: 14, skipped: 2, started: 14, success: 14}

        dagster-user-deployments:
          enabled: true
          enableSubchart: true
          deployments:
            - name: iso-lab
              image:
                repository: zot.phillips-homelab.net/iso-lab
                tag: "43b1eec"   # bump to deploy a new build
                pullPolicy: IfNotPresent
              dagsterApiGrpcArgs: ["-m", "iso_lab.definitions"]
              port: 4000
              envSecrets:
                - name: iso-lab-env
              env:
                - {name: LAKE_S3_ENDPOINT, value: "http://garage.garage.svc:3900"}
                - {name: LAKE_BUCKET, value: iso-market-data}
                - {name: CLICKHOUSE_HOST, value: clickhouse}
                # Explicit, because Kubernetes injects CLICKHOUSE_PORT=tcp://<ip>:8123 for the
                # `clickhouse` Service (service links), which the code and dbt profile read.
                - {name: CLICKHOUSE_PORT, value: "8123"}
                - {name: CLICKHOUSE_USER, value: iso}
                - {name: ALERT_NTFY_URL, value: "http://ntfy.ntfy.svc.cluster.local/iso-lab"}
                - {name: DAGSTER_UI_URL, value: "https://dagster.phillips-homelab.net"}
                # Run-outcome / lake-size gauges (defs/metrics.py sensor) -> VictoriaMetrics.
                - {name: METRICS_IMPORT_URL, value: "http://vmsingle-vmstack.monitoring.svc:8429/api/v1/import/prometheus"}
              # The chart points DAGSTER_HOME here without mounting anything in this pod;
              # runs execute here (DefaultRunLauncher) and write step storage under it.
              volumes:
                - name: dagster-home
                  emptyDir: {sizeLimit: 1Gi}
              volumeMounts:
                - name: dagster-home
                  mountPath: /opt/dagster/dagster_home
              # Every run is a child process of this server, plus dbt as its own process: steady
              # peaks are ~1.1-1.3 GB, and a poll's dbt build overlapping a freshness run OOM-killed
              # the server at 2Gi (2026-10-09 12:52 UTC; its two runs were left as zombies, see
              # defs/reaper.py). 4Gi on homelab-04 (64 GB); the request matches the steady state.
              resources:
                requests: {cpu: 100m, memory: 1Gi}
                limits: {memory: 4Gi}
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile: {type: RuntimeDefault}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              # Prefer homelab-04 (Ryzen 7 9700X, mostly idle): dbt is CPU-bound (~95% of a
              # run is dbt's own work, ~5% ClickHouse), and homelab-01 also hosts etcd on a
              # busy NVMe. Preferred, not required, so runs still schedule if homelab-04 is down.
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - {key: kubernetes.io/hostname, operator: In, values: [homelab-04]}
              labels:
                iso-lab/role: ingest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
