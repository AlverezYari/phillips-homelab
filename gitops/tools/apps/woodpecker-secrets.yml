# 1P item `woodpecker-config` (vault behind the `staging` store):
#   agent_secret          random 64 chars; shared server<->agent gRPC secret
#   forgejo_client_id     Forgejo OAuth2 app (Site Administration > Applications,
#   forgejo_client_secret  redirect URI https://ci.phillips-homelab.net/authorize)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-default-agent-secret
  namespace: woodpecker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: woodpecker-default-agent-secret
    creationPolicy: Owner
  data:
  - secretKey: WOODPECKER_AGENT_SECRET
    remoteRef:
      key: woodpecker-config
      property: agent_secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-forgejo
  namespace: woodpecker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: woodpecker-forgejo
    creationPolicy: Owner
  data:
  - secretKey: WOODPECKER_FORGEJO_CLIENT
    remoteRef:
      key: woodpecker-config
      property: forgejo_client_id
  - secretKey: WOODPECKER_FORGEJO_SECRET
    remoteRef:
      key: woodpecker-config
      property: forgejo_client_secret
