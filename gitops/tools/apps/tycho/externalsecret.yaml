# Main config secret for the tycho operator, synced from 1Password via ESO.
# Expects a "tycho" item in the vault backing the `staging` ClusterSecretStore
# with fields: see_start_pem, s3_access_key_id, s3_secret_access_key (Garage),
# source_auth_token.
# One secret, many keys: add new fields to the 1P item and a matching data
# entry here as the operator grows, rather than one ExternalSecret per value.
# POSTGRES_DSN is NOT here: the gateway takes it from the CNPG-generated
# tycho-pg-app secret per the usual <cluster>-app convention.
# Will show SecretSyncedError until the 1P item is seeded.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tycho-config
  namespace: tycho
  annotations:
    # Client-side apply: SSA conflicts with ESO's field manager on spec.data
    # and can wedge the sync (see stock-bot ExternalSecrets).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: tycho-config
    creationPolicy: Owner
  data:
  - secretKey: see_start_pem
    remoteRef:
      key: tycho
      property: see_start_pem
  - secretKey: S3_ACCESS_KEY_ID
    remoteRef:
      key: tycho
      property: s3_access_key_id
  - secretKey: S3_SECRET_ACCESS_KEY
    remoteRef:
      key: tycho
      property: s3_secret_access_key
  # ADR 0009 retired the shared fleet token: agents no longer present one
  # value that every scope holds. IDENTITY_TOKEN is now this scope's own
  # secret, issued once by the gateway when its setup code was redeemed
  # and unrecoverable afterwards — if it is lost, mint a new code from
  # the owner's deck rather than looking for it somewhere.
  #
  # SOURCE_AUTH_TOKEN is gone: gateway/main.go no longer reads it, so
  # leaving it here would be a live credential nothing consumes.
  - secretKey: IDENTITY_TOKEN
    remoteRef:
      key: tycho
      property: scope_secret_seestar_1
  # ADR 0009: the service credential the tychofleet site presents to the
  # gateway's /v1/scopes API (create a scope, mint a setup code, rename,
  # remove). Distinct from every other token here — the gateway refuses
  # to start if it collides with one. The site's own ExternalSecret
  # reads this same 1Password field so the two can never drift.
  - secretKey: SITE_API_TOKEN
    remoteRef:
      key: tycho
      property: SITE_API_TOKEN
