# Publishes tycho-gateway on the Tycho fleet tailnet.
#
# This is the address in every member's tycho.yaml. A member runs
# tycho-client beside their scope; it brings itself up as an embedded
# tsnet node (agent/internal/tailnet) and reaches the gateway here to
# redeem its setup code, fetch the device interop key, register,
# heartbeat and upload.
#
# L7 Ingress rather than an L3 Service so Tailscale terminates TLS at the
# proxy and members get a real https:// endpoint with a valid cert,
# rather than plain HTTP carrying a per-scope secret.
#
# Attaches to the fleet ProxyGroup by annotation: a plain
# `tailscale.com/expose` Service cannot choose a tailnet, and this must
# land on the fleet tailnet rather than the homelab one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tycho-gateway-tailnet
  namespace: tycho
  annotations:
    tailscale.com/proxy-group: tycho-fleet-ingress
    # The Tailscale Service this Ingress creates must carry the SAME tag
    # as the proxy nodes that host it. Without this it inherits the
    # operator default (tag:k8s) while the ProxyGroup nodes carry
    # tag:gateway, and control then refuses to grant the service cert
    # domain to those nodes — the cert Secret stays 0 bytes, and the
    # operator will not advertise an HTTPS-only Ingress without a cert.
    # Advertise-needs-cert, cert-needs-advertise: nothing errors, the
    # Ingress simply never gets an address.
    tailscale.com/tags: "tag:gateway"
    # Breaks a cert/advertise deadlock. For an HTTPS-only Ingress the
    # operator refuses to advertise the Tailscale Service until a cert
    # exists (maybeUpdateAdvertiseServicesConfig), while the proxy's
    # cert loop blocks until control grants the service cert domain —
    # which control only does once a host advertises it. Neither side
    # moves, nothing errors, and the Ingress simply never gets an
    # address.
    #
    # http-endpoint switches to HTTP+HTTPS, which advertises WITHOUT
    # waiting for a cert. The service then publishes, control grants the
    # domain, and the proxy issues the cert. Once tls.crt is non-empty
    # this annotation can be removed to go back to HTTPS-only.
    tailscale.com/http-endpoint: "enabled"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - tycho-gateway
  rules:
    # Fully-qualified: the operator rejects a short host outright
    # ("rule with host "tycho-gateway" ignored, unsupported"). Only
    # tls.hosts above takes the short form, which is what names the
    # tailnet device.
    - host: tycho-gateway.tail92d9b0.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tycho-gateway
                port:
                  number: 80
---
# Only this namespace may attach to the fleet tailnet's ingress proxies.
# ProxyGroupPolicy is namespaced in the namespace being GRANTED access,
# and its `ingress` list names the ProxyGroups that Ingress resources
# here may use (verified against the CRD schema — it is not the reverse).
#
# Without it, any namespace in the cluster could annotate an Ingress onto
# tycho-fleet-ingress and publish itself to every member's telescope.
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tycho-fleet-ingress
  namespace: tycho
spec:
  ingress:
    - tycho-fleet-ingress
