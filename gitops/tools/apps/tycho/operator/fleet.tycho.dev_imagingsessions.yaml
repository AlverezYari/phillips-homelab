---
# NOT applied directly. This file is a hand-maintained mirror of the
# Go API types (see deploy/operator/README.md) -- the cluster reads a
# hand-copied version of it at gitops/tools/apps/tycho/operator/ in the
# phillips-homelab repo, not this one. A field added here is not
# deployed until that copy is made by hand: Kubernetes silently prunes
# any field a CRD's schema does not declare, with no error or warning
# to the writer.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: imagingsessions.fleet.tycho.dev
spec:
  group: fleet.tycho.dev
  names:
    kind: ImagingSession
    listKind: ImagingSessionList
    plural: imagingsessions
    shortNames:
    - imsess
    singular: imagingsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceID
      name: Source
      type: string
    - jsonPath: .spec.sessionID
      name: Session
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.closeReason
      name: CloseReason
      type: string
    - jsonPath: .status.subCount
      name: Subs
      type: integer
    - jsonPath: .status.combineJobRef.name
      name: Job
      type: string
    - jsonPath: .status.attempts
      name: Attempts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImagingSession is one observing-night session for one Seestar,
          tracked from open through combine-job completion.

          CaptureProgram and Observation are reserved for fleet scheduling
          (BRIEF.md) and are deliberately not implemented here.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImagingSessionSpec identifies one observing-night session and where
              its objects live in Garage.
            properties:
              objectPrefix:
                description: |-
                  ObjectPrefix is the Garage key prefix for this session's objects
                  (schemas/object-layout.md), e.g.
                  "tycho-source-{id}/sessions/{sessionID}/".
                minLength: 1
                type: string
              sessionID:
                description: |-
                  SessionID is the session identity used in event envelopes and
                  the object layout (sessions/{sessionID}/...).
                minLength: 1
                type: string
              sourceID:
                description: SourceID is the owning Seestar's tycho-agent source id.
                minLength: 1
                type: string
              target:
                description: |-
                  Target is this session's target slug: the human-facing path
                  component used in a target master's location
                  (masters/{target-slug}/, schemas/object-layout.md) and CR names.
                  Session grouping and matching itself is decided by sky position,
                  not by this string (docs/ATTRIBUTION.md, "sky position decides
                  grouping, names stay for humans") -- see
                  internal/targetmaster.CombinableSessions and .ResolveTargetSlug,
                  which choose Target deterministically from TargetRADeg/
                  TargetDecDeg when available, falling back to a name-derived slug
                  (SlugFromSessionID) otherwise.
                type: string
              targetDecDeg:
                description: |-
                  TargetRADeg and TargetDecDeg are this session's target sky
                  position in degrees (ICRS-like RA/Dec), forwarded from the
                  session's manifest.json target block
                  (schemas/manifest.schema.json) via the tycho.session.closed
                  event's optional target_ra_deg/target_dec_deg fields
                  (schemas/tycho.session.closed.schema.json) at session-close
                  time -- the operator has no S3 access to read manifest.json
                  directly, so the closing event is the only
                  route a position can reach it by. Both are nil together for a
                  session whose close event didn't carry one: a quiescence-timeout
                  close never reads a manifest at all, and an older or malformed
                  manifest may lack a usable target block.
                  internal/targetmaster falls back to Target-slug matching for
                  such a session rather than dropping it from its target's
                  grouping -- a session must never vanish from grouping for lack of
                  coordinates (docs/ATTRIBUTION.md).
                type: number
              targetRADeg:
                description: |-
                  TargetRADeg and TargetDecDeg are this session's target sky
                  position in degrees (ICRS-like RA/Dec), forwarded from the
                  session's manifest.json target block
                  (schemas/manifest.schema.json) via the tycho.session.closed
                  event's optional target_ra_deg/target_dec_deg fields
                  (schemas/tycho.session.closed.schema.json) at session-close
                  time -- the operator has no S3 access to read manifest.json
                  directly, so the closing event is the only
                  route a position can reach it by. Both are nil together for a
                  session whose close event didn't carry one: a quiescence-timeout
                  close never reads a manifest at all, and an older or malformed
                  manifest may lack a usable target block.
                  internal/targetmaster falls back to Target-slug matching for
                  such a session rather than dropping it from its target's
                  grouping -- a session must never vanish from grouping for lack of
                  coordinates (docs/ATTRIBUTION.md).
                type: number
            required:
            - objectPrefix
            - sessionID
            - sourceID
            type: object
          status:
            description: |-
              ImagingSessionStatus tracks close detection and the resulting
              combine Job.
            properties:
              attempts:
                description: |-
                  Attempts counts consecutive combine failures since this
                  session's last successful combine (or since it was first
                  created, if it has never succeeded): incremented each time a
                  combine Job for this session reaches Failed, reset to 0 on
                  Done. ensureCombineJob refuses to retry a Failed session once
                  Attempts reaches the bounded retry limit (operator/internal/
                  sessionclose.maxCombineAttempts) -- see Phase=Failed with
                  Attempts at that limit as the observable "permanently failed,
                  needs a human" terminal state: not that the combine failed,
                  but that nothing said so and nothing tried again. A retry
                  triggered by the session growing (more subs than the failed
                  revision covered) resets Attempts back to 0 first, since new
                  data deserves its own fresh retry budget rather than inheriting
                  an unrelated prior failure streak.
                format: int32
                type: integer
              closeReason:
                description: |-
                  CloseReason records how the session's close was detected, once
                  closed.
                enum:
                - clean
                - quiescence
                type: string
              closedAt:
                description: |-
                  ClosedAt is when the session was detected closed (clean or
                  quiescence).
                format: date-time
                type: string
              combineCompletedAt:
                description: |-
                  CombineCompletedAt is when the combine Job finished (success or
                  failure).
                format: date-time
                type: string
              combineJobRef:
                description: |-
                  CombineJobRef names the k8s Job spawned to combine this
                  session's subs, once one has been created.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              combineStartedAt:
                description: CombineStartedAt is when the combine Job was created.
                format: date-time
                type: string
              combinedSubCount:
                description: |-
                  CombinedSubCount is the sub_count Revision's combine Job was
                  spawned to combine. Compared against a later close event's
                  sub_count to detect the session growing past what the latest
                  revision covered.
                format: int32
                type: integer
              jobStartedPublishedRevision:
                description: |-
                  JobStartedPublishedRevision is the last Revision whose
                  tycho.job.stack.started event was actually published
                  successfully. Separate from Revision/CombineJobRef (set as soon
                  as the Job is created, regardless of publish outcome) so a
                  redelivered close signal for a Job that already exists
                  (created=false in ensureCombineJob) can still tell whether the
                  started event for the current revision made it out, and retry
                  the publish alone if it didn't (issue #127: `created=false` must
                  not mean "never publish").
                format: int32
                type: integer
              phase:
                description: Phase is the session's current lifecycle state.
                enum:
                - Open
                - Closed
                - Combining
                - Done
                - Failed
                - Unsalvageable
                type: string
              resultKeys:
                description: |-
                  ResultKeys lists the Garage object keys the combine Job produced,
                  populated on successful completion.
                items:
                  type: string
                type: array
              revision:
                description: |-
                  Revision is the combine Job revision CombineJobRef currently
                  names: 1 for the session's original combine, 2+ for a recombine
                  spawned because the session grew (more subs closed) after an
                  earlier revision already completed. Part of the Job's name
                  (stack-<sessionID> for revision 1, stack-<sessionID>-r2 for
                  revision 2, ...) so redelivered/duplicate close signals for the
                  same revision keep hitting the same deterministic name.
                format: int32
                type: integer
              subCount:
                description: SubCount is the accepted-sub count as of close.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
