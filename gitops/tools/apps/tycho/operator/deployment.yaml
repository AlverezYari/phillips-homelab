# tycho-operator Deployment.
#
# tycho5 items 2-5: Seestar status controller (NATS_URL,
# SEESTAR_STALE_AFTER), session-close consumer + combine Job spawn
# (SESSION_QUIESCENCE_TIMEOUT, COMBINE_IMAGE, COMBINE_S3_SECRET_NAME,
# COMBINE_SCRATCH_SIZE), ntfy notifications (NTFY_URL, optional). tycho12
# (issue #32 tier 2) adds the weather poller (WEATHER_ENABLED,
# WEATHER_POLL_INTERVAL, WEATHER_USABLE_THRESHOLD_PERCENT) — see this
# directory's README for the manual per-Seestar site-coordinate step
# it depends on. See operator/main.go's loadConfig for the current,
# authoritative env var list, and this directory's README for the
# combine Job template's container contract (env vars the image
# COMBINE_IMAGE points at must honor).
#
# COMBINE_IMAGE below points at a real, pushed image and is bumped by
# hand whenever combine/ changes in a way a running cluster needs. It
# is not tracked by kustomization.yaml images[], because it names the
# image the operator writes into Job specs rather than an image the
# operator itself runs.
#
# Assumptions the operator should confirm/adjust before applying (SPEC:
# real-infra integration is validated by the operator, not this loop):
#   - Runs in the `tycho` namespace, alongside tycho-gateway and
#     tycho-agent (deploy/gateway/, deploy/agent/).
#   - Single replica: the operator does not need HA for this loop's
#     scope (leader election is wired but off by default via
#     LEADER_ELECT; flip it on and raise replicas together if that
#     changes).
#   - `image` points at the registry `make images`/`make push` (repo
#     root Makefile) and `.forgejo/workflows/ci.yml`'s tag-triggered
#     job publish to (`REGISTRY ?= zot.phillips-homelab.net`). The tag
#     below is a placeholder — pin it via this directory's
#     `kustomization.yaml` `images[].newTag` (set to a real `make
#     images`/CI build's tag, e.g. a git short sha) before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tycho-operator
  namespace: tycho
  labels:
    app.kubernetes.io/name: tycho-operator
    app.kubernetes.io/part-of: tycho
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tycho-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tycho-operator
    spec:
      serviceAccountName: tycho-operator
      # Satisfies PodSecurity "restricted", matching gateway/agent.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: zot.phillips-homelab.net/tycho-operator:latest # pin via kustomization.yaml images[].newTag — see comment above
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          env:
            - name: METRICS_ADDR
              value: ":8080"
            - name: HEALTH_PROBE_ADDR
              value: ":8081"
            - name: LEADER_ELECT
              value: "false"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  # Credentialed URL — loops NATS requires auth; same
                  # borrowed secret as the gateway until issue #29 lands.
                  name: tycho-nats
                  key: NATS_URL
            # SEESTAR_STALE_AFTER is optional (default 3m, ~3x
            # tycho-agent's default 60s heartbeat interval); set
            # explicitly here so cluster behavior doesn't silently
            # follow whatever operator/main.go's default happens to be.
            - name: SEESTAR_STALE_AFTER
              value: "3m"
            # SESSION_QUIESCENCE_TIMEOUT is optional (default 5m, per
            # BRIEF.md's "quiescence timeout ~5 min" fallback).
            - name: SESSION_QUIESCENCE_TIMEOUT
              value: "5m"
            # COMBINE_IMAGE/COMBINE_S3_SECRET_NAME are required — the
            # operator fails closed at startup without them. See the
            # placeholder-image note above.
            - name: COMBINE_IMAGE
              # Bumped by hand, and it has drifted before: it sat 70
              # commits stale through the #148 deploy, so the recipe
              # feature was live everywhere except the container that
              # reads it (tycho #154). Bump this whenever combine/
              # changes, and check it moved after ArgoCD syncs.
              value: "zot.phillips-homelab.net/tycho-combine:b06bf2f"
            # ADR 0010 outbound delivery. Both are REQUIRED: the
            # operator fails closed at startup without them, so this
            # block must land in the same commit as the image bump.
            #
            # DELIVERY_JOB_IMAGE: the real delivery Job image as of
            # tycho #195 (ADR 0010's first adapter, kind: s3). Bump
            # alongside the operator tag whenever operator/cmd/deliverjob
            # or the adapter changes — same drift hazard as
            # COMBINE_IMAGE above.
            - name: DELIVERY_JOB_IMAGE
              value: "zot.phillips-homelab.net/tycho-deliver:91d41d0"
            # SA delivery Job pods run as (rbac.yaml's tycho-deliver:
            # get deliveries/deliverytargets, update deliveries/status,
            # nothing else). REQUIRED, fail-closed (tycho #197).
            - name: DELIVERY_JOB_SERVICE_ACCOUNT_NAME
              value: "tycho-deliver"
            # DELIVERY_MAX_CONCURRENT is optional (default 1): how many
            # delivery Jobs run at once (tycho #200's cap — ~20 ran
            # concurrently during the 2026-08-06 etcd incident). 2 is
            # safe now that S3-adapter status is O(1)+rate-limited, and
            # halves large-backfill wall clock.
            - name: DELIVERY_MAX_CONCURRENT
              value: "2"
            # Names the Secret whose `uri` key is the catalog DSN the
            # delivery Job injects as DELIVERY_CATALOG_DSN (SecretKeyRef,
            # tycho #196) — the CNPG <cluster>-app Secret, same one the
            # gateway reads. REQUIRED, fail-closed at operator startup.
            - name: DELIVERY_JOB_CATALOG_DSN_SECRET_NAME
              value: "tycho-pg-app"
            # Source-side S3 creds for delivery Jobs (reading the
            # Garage archive) — the same Secret combine Jobs use.
            # REQUIRED: the operator fails closed at startup without
            # it (tycho #195's LoadConfig), which is exactly how its
            # absence was discovered — a CrashLoopBackOff, not a
            # silent delivery no-op.
            - name: DELIVERY_JOB_S3_SECRET_NAME
              value: "tycho-combine-s3"
            # Read-only in intent: DeliveryReconciler's admission needs
            # a session's frame count and accepted-byte total before
            # any Job exists. Uses the same Secret the gateway writes
            # with, because no read-only role exists yet (tycho #172).
            - name: DELIVERY_CATALOG_DSN
              valueFrom:
                secretKeyRef:
                  name: tycho-pg-app
                  key: uri
            - name: COMBINE_S3_SECRET_NAME
              value: "tycho-combine-s3" # hand-minted from tycho-config values — see README
            # COMBINE_SCRATCH_SIZE is optional (default 10Gi): the size
            # of the combine Job's scratch volume. Full-res output
            # (tycho #190) is 4x the pixels of the half-res grid this
            # was last sized for: measured 43 GB at N=626 half-res
            # (m-13-2026-07-18 r3) scales to ~172 GB. 200Gi adds
            # headroom; the nvme-scratch disk has 862 GB free.
            - name: COMBINE_SCRATCH_SIZE
              value: "200Gi"
            # Scratch on the homelab-04 NVMe via a generic ephemeral
            # volume instead of emptyDir. Unset storage class = legacy
            # emptyDir. The node pin is load-bearing, not an
            # optimization: local-path-config's nodePathMap lists ONLY
            # homelab-04, and with WaitForFirstConsumer a combine Job
            # scheduled anywhere else would sit Pending forever. Widen
            # nodePathMap before relaxing this. Inert until the
            # operator image carries loop/combinescratch.
            - name: COMBINE_SCRATCH_STORAGE_CLASS
              value: "nvme-scratch"
            - name: COMBINE_SCRATCH_NODE_SELECTOR
              value: "kubernetes.io/hostname=homelab-04"
            # COMBINE_CPU_LIMIT is optional (default 2): the combine
            # Job's CPU limit, forwarded into the container as of
            # tycho #190 so the pipeline sizes its reprojection worker
            # pool off its real allocation. 8 of homelab-04's 16
            # cores: the Job is burstable (requests stay 250m), so two
            # concurrent combines bursting to 8 each just share the
            # node rather than blocking scheduling. Memory cost is
            # bounded: each reprojection worker holds one frame
            # (~133Mi at full res) at a time, so 8 workers add ~1Gi
            # against COMBINE_MEMORY_LIMIT's 12Gi.
            - name: COMBINE_CPU_LIMIT
              value: "8"
            # COMBINE_MAX_CONCURRENT is optional (default 1): how many
            # combine Jobs (session, master, fleet) may run at once.
            # The default-1 was sized for a 10Gi emptyDir era; scratch
            # is now 200Gi claims on the 860 GB homelab-04 NVMe, so 2
            # concurrent costs 400Gi scratch, 2x12Gi memory limit and
            # 2x8 CPU limit -- all inside the node. Raise past 2 only
            # after checking scratch headroom: N x 200Gi must stay
            # under what the NVMe actually has free.
            - name: COMBINE_MAX_CONCURRENT
              value: "2"
            # COMBINE_MEMORY_LIMIT: operator/main.go's 4Gi default is
            # sized for ADR 0003's v0 operating point (~10 inputs) and
            # says outright that a combine growing past it should raise
            # this rather than rely on a bigger default. Issue #45 made
            # sessions 600+ inputs: the first real 626-input combine
            # (m-13-2026-07-18 r3, 2026-08-04) peaked at 4006Mi against
            # the 4096Mi limit -- 97.8%, surviving on luck. The tiled
            # path bounds peak RAM independently of N, but sigma-clip's
            # per-tile float64 temporaries make the real peak several
            # times the nominal tile budget. 12Gi is ~3x the observed
            # peak; homelab-04 has 62Gi allocatable at 18% use, so the
            # old ceiling was arbitrary, not a capacity constraint.
            - name: COMBINE_MEMORY_LIMIT
              value: "12Gi"
            # NTFY_URL is optional: a full ntfy topic URL for
            # best-effort session-close/combine-result notifications.
            # Unset (the default — no value here) disables
            # notifications entirely; there's no real topic to point at
            # yet, so it's deliberately left unset rather than set to a
            # placeholder that would silently start posting somewhere.
            # - name: NTFY_URL
            #   value: "https://ntfy.sh/your-topic-here"
            # WEATHER_ENABLED is the tier-2 sky-conditions kill-switch
            # (default true); flip to "false" to disable Open-Meteo
            # polling entirely without a rollout.
            - name: WEATHER_ENABLED
              value: "true"
            # WEATHER_POLL_INTERVAL is optional (default 30m).
            - name: WEATHER_POLL_INTERVAL
              value: "30m"
            # WEATHER_USABLE_THRESHOLD_PERCENT is optional (default
            # 40): status.sky.usable is true when cloud cover is below
            # this percentage.
            - name: WEATHER_USABLE_THRESHOLD_PERCENT
              value: "40"
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
