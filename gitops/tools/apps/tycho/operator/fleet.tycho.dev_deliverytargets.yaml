---
# NOT applied directly. This file is a hand-maintained mirror of the
# Go API types (see deploy/operator/README.md) -- the cluster reads a
# hand-copied version of it at gitops/tools/apps/tycho/operator/ in the
# phillips-homelab repo, not this one. A field added here is not
# deployed until that copy is made by hand: Kubernetes silently prunes
# any field a CRD's schema does not declare, with no error or warning
# to the writer.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: deliverytargets.fleet.tycho.dev
spec:
  group: fleet.tycho.dev
  names:
    kind: DeliveryTarget
    listKind: DeliveryTargetList
    plural: deliverytargets
    shortNames:
    - dtarget
    singular: deliverytarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.memberID
      name: Member
      type: string
    - jsonPath: .spec.adapterKind
      name: Adapter
      type: string
    - jsonPath: .spec.artifactClasses
      name: Artifact
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.refusalReason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DeliveryTarget is a named destination for outbound delivery: an
          adapter kind, a credential reference, an artifact class, a scope
          (member/everything/campaign, ADR 0011), and the settings a Delivery
          against it is spawned with.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DeliveryTargetSpec names one member's destination for outbound
              delivery: adapter kind, an opaque credential reference, which
              artifact class it receives, per-target settings, and the enable
              toggle (default off, per ADR 0010 §2 — never defaulted on by the
              framework).

              Member-scoped, structurally: MemberID is required and immutable
              (the XValidation rule below rejects any update that changes it), so
              it is a safe join key for admission and for the controller's
              session-to-target pairing. A DeliveryTarget cannot be re-pointed at
              a different member after creation, and nothing in this package ever
              trusts a MemberID that arrived any other way — see
              DeliverySpec.MemberID and internal/delivery's admission chokepoint,
              which is the one place a mismatch is checked before a Job is ever
              spawned (ADR 0010 §2: "a fleet owner must not be able to publish
              another member's data by configuring a fleet").
            properties:
              adapterKind:
                description: AdapterKind selects which compiled-in adapter this
                  target speaks through.
                enum:
                - fake
                - s3
                - crowdsky
                - gdrive
                type: string
              artifactClasses:
                description: |-
                  ArtifactClasses selects which artifact(s) this target receives --
                  plural because SPEC's member-selective shape needs raws delivered
                  standing, plus optional stacks and masters, ALL on the same
                  target. Convention, not an enforced invariant: "everything" is
                  intended as a target's only class rather than combined with the
                  session-scoped classes.
                items:
                  description: DeliveryArtifactClass selects which of a session's
                    (or, for "everything", the whole archive's) artifacts a target
                    receives.
                  enum:
                  - raw_subs
                  - stacks
                  - masters
                  - everything
                  - results
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              backfill:
                default: false
                description: |-
                  Backfill delivers every existing session this target already
                  matches (any session already in a terminal combined state --
                  Done or Unsalvageable, tycho#191) rather than only sessions that
                  close from now on. The member-selective shape's real first user
                  (a member cross-checking their own Siril pipeline against ours)
                  wants their existing ~80 GB backfilled, not just tonight's
                  session onward. Evaluated by DeliveryTargetReconciler whenever
                  this target is Active: every existing matching session gets its
                  Delivery ensured (create-if-missing, same dedupe-by-name the
                  session-close trigger uses), so a session that closes AFTER this
                  flag was already true is not double-delivered, and a target
                  created with Backfill=false that flips it on later still picks
                  up the backlog on its next reconcile. Metered like any other
                  delivery -- a large backfill is not special-cased, only bounded
                  by the member's own byte allowance (DeliveryQuota).
                type: boolean
              bundle:
                default: false
                description: |-
                  Bundle opts this target into per-session zip delivery: instead of
                  SendFile-ing each matching artifact loose, the deliver Job streams
                  the session's artifacts into a SINGLE zip (STORE method, built on
                  a scratch disk volume, never in memory) and delivers that one
                  file. Default false -- loose-file delivery, today's shipped
                  behavior, is unchanged when this is unset.

                  Delta-safety (do not defeat this): a bundle Delivery is only ever
                  built for a TERMINAL session (Done/Unsalvageable) and delivered
                  EXACTLY ONCE -- a re-arm (master-rebuild, resync, the m-13-style
                  churn) must find the zip already at the destination and skip
                  before re-fetching or re-zipping anything. Unlike the loose-file
                  model, a remote zip cannot be incrementally updated, so this flag
                  is not meant for a target whose session keeps growing after this
                  target first delivers it. Per-target/campaign AGGREGATE zips
                  (which would grow across sessions) are explicitly out of scope --
                  this flag only ever produces one zip per (session, target).
                type: boolean
              campaignTargets:
                description: |-
                  CampaignTargets is the set of sky positions a Scope=campaign
                  target attributes closing sessions against (ADR 0011). Required,
                  non-empty, for that scope (admission refuses an empty or
                  structurally invalid entry); unused otherwise.
                items:
                  description: |-
                    CampaignTargetSpec is one sky position a campaign-scoped
                    DeliveryTarget attributes closing sessions against. Plural on
                    DeliveryTargetSpec (CampaignTargets) because one campaign can span
                    more than one pointing (e.g. a mosaic); a session matches if it
                    falls within MatchRadiusDeg of ANY entry, not all.
                  properties:
                    decDeg:
                      description: DecDeg is this campaign position's declination,
                        in degrees.
                      type: number
                    matchRadiusDeg:
                      description: |-
                        MatchRadiusDeg is the great-circle cone radius
                        (skymatch.MatchesTarget) a closing session's own representative
                        coordinate must fall within to attribute to this position. Must
                        be > 0 -- admission refuses a non-positive radius
                        (deliverytarget_controller.go), rather than silently matching
                        nothing or (at radius 0 with an exact coordinate match) everything
                        depending on float equality.
                      type: number
                    raDeg:
                      description: |-
                        RADeg is this campaign position's right ascension, in degrees --
                        the same ICRS-like convention skymatch.Point and the catalog's
                        target_ra_deg carry.
                      type: number
                  required:
                  - decDeg
                  - matchRadiusDeg
                  - raDeg
                  type: object
                type: array
              consentRecord:
                description: |-
                  ConsentRecord captures what the member was shown before
                  enabling this target (ADR 0010 §7). Nil until the member has
                  gone through consent at least once.
                properties:
                  acceptedAt:
                    description: AcceptedAt is when the member accepted this TermsVersion.
                    format: date-time
                    type: string
                  termsText:
                    description: |-
                      TermsText is the verbatim text shown to the member. Where a
                      destination has no published terms, this says exactly that
                      rather than implying protections that do not exist (ADR §7).
                    minLength: 1
                    type: string
                  termsVersion:
                    description: |-
                      TermsVersion identifies the shown terms text's version, or a
                      fixed sentinel such as "none-published" when the destination
                      has no published terms to version.
                    minLength: 1
                    type: string
                required:
                - acceptedAt
                - termsText
                - termsVersion
                type: object
              credentialRef:
                description: |-
                  CredentialRef names a Secret holding this target's opaque
                  credential (ADR 0010 §8). The framework never reads its
                  contents — only the adapter does, and the fake adapter in this
                  loop ignores it entirely.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              credentialScheme:
                description: CredentialScheme names how CredentialRef should be
                  presented.
                enum:
                - basic
                - bearer
                type: string
              enabled:
                default: false
                description: |-
                  Enabled gates whether the controller will ever spawn a Delivery
                  Job against this target. Default off (ADR 0010 §2): opt-in,
                  never defaulted on by the framework.
                type: boolean
              memberID:
                description: |-
                  MemberID is the owning member for Scope=member (required), and is
                  stamped directly onto every Delivery Scope=everything spawns.
                  Unused, and refused if set, for Scope=campaign (ADR 0011) -- a
                  campaign-scoped target is fleet-wide by construction, and each
                  attributed session's Delivery carries ITS OWN owning member
                  instead (delivery_trigger.go), resolved the same way member-scope
                  resolution already does. Immutable once set.
                type: string
                x-kubernetes-validations:
                - message: memberID is immutable
                  rule: self == oldSelf
              quota:
                description: |-
                  Quota is this member's plan allowance. See DeliveryQuota's doc
                  comment for why it is carried here rather than on a separate
                  object.
                properties:
                  maxBytesPerPeriod:
                    default: 10737418240
                    description: |-
                      MaxBytesPerPeriod caps bytes this member may deliver across all
                      of their targets in one PeriodDays window. Admission refuses,
                      never queues past this silently (ADR 0010 §4/§5).
                    format: int64
                    type: integer
                  maxEnabledTargets:
                    default: 1
                    description: |-
                      MaxEnabledTargets caps how many of this member's DeliveryTargets
                      may have DeliveryTargetStatus.Phase=Active at once. Default 1 — ADR 0010 §5:
                      "one is the right free-tier number."
                    format: int32
                    minimum: 1
                    type: integer
                  periodDays:
                    default: 30
                    description: PeriodDays is the window MaxBytesPerPeriod is measured
                      over.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              scope:
                description: |-
                  Scope discriminates member/everything/campaign attribution (ADR
                  0011). Optional on the wire for backward compatibility: an unset
                  Scope is never defaulted by the CRD (no kubebuilder default) --
                  EffectiveScope resolves it instead, so a target written before
                  this field existed keeps behaving exactly as it did before.
                enum:
                - member
                - everything
                - campaign
                type: string
              settings:
                additionalProperties:
                  type: string
                description: |-
                  Settings carries adapter-specific, per-target configuration
                  (e.g. a future scrub_location-style flag) as opaque string
                  key/value pairs — the framework never interprets these itself.
                type: object
              sourceAllowList:
                description: |-
                  SourceAllowList restricts which sources' closing sessions a
                  Scope=campaign target attributes to itself (ADR 0011) -- the same
                  shape and semantics as FleetMasterSpec.SourceAllowList
                  (targetmaster.Allowed), reused directly rather than reimplemented.
                  Empty (the default) means any source in a matching CampaignTargets
                  cone is attributed. Unused for member/everything scope.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - adapterKind
            - artifactClasses
            - credentialRef
            - credentialScheme
            type: object
          status:
            description: |-
              DeliveryTargetStatus reports whether this target is currently
              eligible for delivery, computed by admission rather than trusted
              from Spec.Enabled directly.
            properties:
              observedGeneration:
                description: |-
                  ObservedGeneration is the Spec generation admission last
                  evaluated, so a client can tell a stale Phase (an edit not yet
                  reconciled) from a current one.
                format: int64
                type: integer
              phase:
                description: Phase is this target's current admission state.
                enum:
                - Disabled
                - Active
                - Refused
                type: string
              refusalReason:
                description: |-
                  RefusalReason names the limit admission refused this target for
                  (Phase=Refused only) — legible to the member, never a silent
                  throttle (ADR 0010 §4/§5).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
