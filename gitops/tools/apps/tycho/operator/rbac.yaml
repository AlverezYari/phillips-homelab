# tycho-operator RBAC.
#
# ClusterRole is generated from the +kubebuilder:rbac markers in
# operator/main.go — regenerate with:
#
#   controller-gen rbac:roleName=tycho-operator paths=./operator/... \
#     output:rbac:dir=/tmp/rbacgen
#
# and copy the resulting role.yaml's `rules:` back in here (the
# ClusterRoleBinding/ServiceAccount below are hand-maintained, not
# generated).
#
# Cluster-scoped (not a Role) because Seestar/ImagingSession are
# namespaced but the operator is meant to run as a single
# cluster-wide instance watching one namespace's worth of CRs today
# with room to watch more without an RBAC change later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tycho-operator
  namespace: tycho
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tycho-operator
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fleet.tycho.dev"]
    resources: ["imagingsessions", "seestars", "targetmasters", "fleetmasters", "deliverytargets", "deliveries"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fleet.tycho.dev"]
    resources: ["imagingsessions/status", "seestars/status", "targetmasters/status", "fleetmasters/status", "deliverytargets/status", "deliveries/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tycho-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tycho-operator
subjects:
  - kind: ServiceAccount
    name: tycho-operator
    namespace: tycho
---
# ServiceAccount + minimal Role for delivery Jobs (tycho #195/#197):
# cmd/deliverjob reads its own Delivery and its DeliveryTarget, and
# writes per-artifact progress via Status().Update. Nothing else — a
# delivery Job can never touch sessions, masters, or other CRDs.
# The operator's Job template sets this SA by name
# (DELIVERY_JOB_SERVICE_ACCOUNT_NAME, fail-closed).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tycho-deliver
  namespace: tycho
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tycho-deliver
  namespace: tycho
rules:
  # The full read surface, grepped from every c.Get in
  # internal/deliveryjob + cmd/deliverjob: the Delivery itself, its
  # DeliveryTarget, the session (driver.go — stacks class reads
  # ResultKeys off the CR), and the TargetMaster (masterfilesource).
  - apiGroups: ["fleet.tycho.dev"]
    resources: ["deliveries", "deliverytargets", "imagingsessions", "targetmasters"]
    verbs: ["get"]
  - apiGroups: ["fleet.tycho.dev"]
    resources: ["deliveries/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tycho-deliver
  namespace: tycho
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tycho-deliver
subjects:
  - kind: ServiceAccount
    name: tycho-deliver
    namespace: tycho
