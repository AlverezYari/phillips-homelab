# iso_ro ClickHouse password for the demo Grafana (same 1Password item as the homelab one).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-iso-clickhouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: grafana-iso-clickhouse
    creationPolicy: Owner
  data:
    - secretKey: ISO_CLICKHOUSE_RO_PASSWORD
      remoteRef: {key: iso-lab, property: clickhouse_ro_password}
---
# The admin area's password (/admin on the gateway): 1Password item miso-lab-admin, fields username and
# password. The template renders an nginx htpasswd line (bcrypt), so neither value is in git or the image.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: miso-lab-admin
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: miso-lab-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: '{{ htpasswd .username .password }}'
  data:
    - secretKey: username
      remoteRef: {key: miso-lab-admin, property: username}
    - secretKey: password
      remoteRef: {key: miso-lab-admin, property: password}
