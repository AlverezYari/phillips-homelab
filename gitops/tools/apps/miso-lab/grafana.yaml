# Demo Grafana: ONLY the iso-lab dashboards, anonymous Viewer, no login form, served from
# /grafana/ by the gateway. Separate from the homelab Grafana so nothing else is exposed.
# Data: iso_ro (readonly ClickHouse user, quota-limited) and VictoriaMetrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: miso-lab-grafana}
  template:
    metadata:
      labels: {app: miso-lab-grafana}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: miso-lab-grafana  # rewritten by kustomization.yaml
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - secretRef: {name: grafana-iso-clickhouse}
          env:
            - {name: GF_SERVER_ROOT_URL, value: "https://miso-lab.phillips-homelab.net/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "false"}
            - {name: GF_EXPLORE_ENABLED, value: "false"}
            - {name: GF_ALERTING_ENABLED, value: "false"}
            - {name: GF_UNIFIED_ALERTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/iso-lab/iso-lab-market.json}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
          readinessProbe:
            httpGet: {path: /grafana/api/health, port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/iso.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/iso.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/iso-lab}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 512Mi}  # stateless: everything is provisioned
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: miso-lab-grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
