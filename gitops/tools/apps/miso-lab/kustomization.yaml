# miso-lab demo portal: https://miso-lab.phillips-homelab.net. INTERNAL for now (homelab
# tls-gateway + blocky, LAN/tailnet only). Going public later = a Cloudflare tunnel hostname +
# Access policy, and re-admitting the cloudflared pods in network-policy.yaml. Plain-English
# tour + read-only live views of the iso-lab platform. See portal/ in the code repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: miso-lab
resources:
  - gateway.yaml
  - grafana.yaml
  - externalsecret.yaml
  - network-policy.yaml
  - reference-grant.yaml
images:
  - name: miso-lab-portal
    newName: zot.phillips-homelab.net/miso-lab-portal
    newTag: "1a470a8"
  - name: miso-lab-grafana
    newName: zot.phillips-homelab.net/miso-lab-grafana
    newTag: "1a470a8"
# PAUSED 2026-10-14: the demo window closed. Data stays (PVCs, lake, Postgres); to resume,
# revert the PR that added the replicas: 0 block below.
replicas:
  - {name: gateway, count: 0}
  - {name: grafana, count: 0}
configMapGenerator:
  - name: grafana-provisioning
    files:
      - grafana/datasources.yaml
      - grafana/dashboards.yaml
  # Same JSON as the homelab Grafana's iso-lab dashboards (deploy/grafana/dashboards, copied by
  # `make portal-sync`; a test fails if they differ).
  - name: grafana-dashboards
    files:
      - dashboards/iso-lab-market.json
      - dashboards/iso-lab-market-history.json
      - dashboards/iso-lab-pipeline.json
      - dashboards/iso-lab-footprint.json
      - dashboards/iso-lab-event-replay.json
      - dashboards/iso-lab-virtuals.json
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: miso-lab
