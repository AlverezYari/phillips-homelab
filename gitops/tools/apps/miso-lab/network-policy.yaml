# Gateway: only the homelab tls-gateway (Cilium envoy, entity "ingress") gets in, i.e. internal
# only for now; going public later adds the Cloudflare tunnel (cloudflared pods in namespace
# cloudflare). It reaches only the demo Grafana and the read-only Dagster webserver. Grafana: only the gateway gets in; it reaches
# only ClickHouse (as iso_ro) and VictoriaMetrics. No internet egress for either.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miso-lab-gateway
spec:
  endpointSelector:
    matchLabels: {app: miso-lab-gateway}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels: {app: miso-lab-grafana}
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
    # Home / Terminal read API (iso-lab miso-api)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iso-lab
            iso-lab/role: api
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
    # "Request a model" form -> homelab ntfy, topic iso-lab-requests (portal/nginx.conf /api/request)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ntfy
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iso-lab
            component: dagster-webserver-read-only
      toPorts:
        - ports: [{port: "80", protocol: TCP}]
    # SQL console (/api/sql) as iso_console
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iso-lab
            app.kubernetes.io/name: clickhouse
      toPorts:
        - ports: [{port: "8123", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miso-lab-grafana
spec:
  endpointSelector:
    matchLabels: {app: miso-lab-grafana}
  ingress:
    - fromEndpoints:
        - matchLabels: {app: miso-lab-gateway}
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iso-lab
            app.kubernetes.io/name: clickhouse
      toPorts:
        - ports: [{port: "8123", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports: [{port: "8429", protocol: TCP}]
