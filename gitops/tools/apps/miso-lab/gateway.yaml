apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: miso-lab-gateway}
  template:
    metadata:
      labels: {app: miso-lab-gateway}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: miso-lab-portal  # rewritten by kustomization.yaml
          ports:
            - {name: http, containerPort: 8080}
          # iso_ro's password, used for the iso_console ClickHouse user (SQL console, /api/sql).
          env:
            - name: CLICKHOUSE_RO_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-iso-clickhouse, key: ISO_CLICKHOUSE_RO_PASSWORD}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: confd, mountPath: /etc/nginx/conf.d}
            - {name: admin, mountPath: /etc/nginx/admin, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: confd
          emptyDir: {sizeLimit: 1Mi}  # rendered nginx config (holds the ClickHouse password)
        - name: admin  # /admin's htpasswd (externalsecret.yaml); optional, so the gateway starts without it
          secret: {secretName: miso-lab-admin, optional: true, items: [{key: htpasswd, path: htpasswd}]}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app: miso-lab-gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
