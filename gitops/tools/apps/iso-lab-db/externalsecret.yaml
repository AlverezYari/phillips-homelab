# One Secret serves both sides: CNPG reads username/password (basic-auth) to
# create the owner role, and the Dagster chart reads `postgresql-password`
# (global.postgresqlSecretName). CNPG's own generated -app secret uses
# different key names, which is why we supply the password instead.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iso-lab-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: iso-lab-pg
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: dagster
        password: "{{ .pg_password }}"
        postgresql-password: "{{ .pg_password }}"
  data:
  - secretKey: pg_password
    remoteRef:
      key: iso-lab
      property: pg_password
