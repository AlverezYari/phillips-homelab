# zot's user list (htpasswd), put together from two 1Password items:
#   zot-auth / htpasswd     the existing users (admin)
#   row-ci-zot / htpasswd   one line, the CI user `row-ci` (row-server#326);
#                           that item's `password` field goes to namespace ci
#                           (ci/row-ci-zot.yaml)
# zot reads this file only when it starts.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zot-auth
  namespace: zot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    creationPolicy: Owner
    template:
      data:
        htpasswd: |
          {{ .htpasswd | trim }}
          {{ .rowci | trim }}
  data:
  - secretKey: htpasswd
    remoteRef:
      key: zot-auth
      property: htpasswd
  - secretKey: rowci
    remoteRef:
      key: row-ci-zot
      property: htpasswd
