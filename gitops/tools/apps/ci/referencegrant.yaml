# Lets the ci.phillips-homelab.net HTTPRoute (namespace gateways) target the
# Woodpecker server Service.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-woodpecker-service
  namespace: woodpecker
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: gateways
  to:
  - group: ""
    kind: Service
