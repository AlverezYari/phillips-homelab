# Hard ceiling on Woodpecker pipeline pods. Sized 2026-11-17 against
# homelab-04: 15.95 CPU / 59.9Gi allocatable, ~11 CPU / 35.5Gi already
# requested (realm, row-sol, jellyfin, row-sims, row-bench, buildkit). CI
# requests (2 CPU here + 1 for the Dagger engine) fit in the ~5 CPU left with
# room for the realm to go Guaranteed; limits let builds burst into idle CPU.
# Real build compute runs in the Dagger engine (namespace `dagger`), capped by
# its own pod limits. Pods over quota fail to create; ci-batch never preempts.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-quota
  namespace: ci
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "24"
    persistentvolumeclaims: "8"
    requests.storage: 100Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-defaults
  namespace: ci
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 256Mi
    default:
      cpu: "1"
      memory: 2Gi
    max:
      cpu: "4"
      memory: 8Gi
