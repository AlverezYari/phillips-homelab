# kd serves this Let's Encrypt certificate on HTTPS and LDAPS ([host] tls_cert_file / tls_key_file) and
# reloads it when cert-manager renews it, so browsers, the tunnel and the demo apps need no private CA.
# Issued by a namespace-local issuer that solves DNS-01 with this app's own Cloudflare token
# (kd-staging-cloudflare, which has DNS edit on the zone), independent of the cluster-wide letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kd-staging-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: kd-staging-acme-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: kd-staging-cloudflare
              key: CF_API_TOKEN
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kd-staging-tls
spec:
  dnsNames:
  - kd-staging.phillips-homelab.net
  issuerRef:
    name: kd-staging-letsencrypt
    kind: Issuer
  secretName: kd-staging-tls
