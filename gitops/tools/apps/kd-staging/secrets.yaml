# Cloudflare token and the Access allowlist come from the 1Password item kd-staging-cloudflare
# (fields api-token, access-emails). The demo apps' OIDC client secrets and the oauth2-proxy cookie secret
# are generated in-cluster once (refreshInterval 0) and never leave the namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kd-staging-cloudflare
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: kd-staging-cloudflare
    creationPolicy: Owner
  data:
  - secretKey: CF_API_TOKEN
    remoteRef:
      key: kd-staging-cloudflare
      property: api-token
  - secretKey: ACCESS_EMAILS
    remoteRef:
      key: kd-staging-cloudflare
      property: access-emails
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kd-staging-secret
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kd-staging-cookie
spec:
  # oauth2-proxy wants a cookie secret of exactly 16, 24 or 32 bytes.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kd-staging-apps
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: "0"
  target:
    name: kd-staging-apps
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kd-staging-secret
    rewrite:
    - regexp: {source: "password", target: "GRAFANA_OIDC_SECRET"}
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kd-staging-secret
    rewrite:
    - regexp: {source: "password", target: "GITEA_OIDC_SECRET"}
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kd-staging-secret
    rewrite:
    - regexp: {source: "password", target: "PROXY_OIDC_SECRET"}
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kd-staging-cookie
    rewrite:
    - regexp: {source: "password", target: "PROXY_COOKIE_SECRET"}
