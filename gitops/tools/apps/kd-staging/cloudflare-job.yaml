# Runs cloudflare-setup.py. A plain Job, not a PostSync hook: a hook makes every sync wait until all resources
# are healthy, which deadlocked the first sync (the certificate could only become healthy from a later revision).
# After it finishes, the TTL deletes it and Argo's self-heal recreates it, so it re-runs about daily and picks up
# allowlist changes. It reads the token and the Access allowlist from the kd-staging-cloudflare Secret
# (1Password item kd-staging-cloudflare); until that Secret exists the pod just waits.
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflare-setup
  annotations:
    # Job specs are immutable: replace instead of patching when the spec changes.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: setup
          image: python:3.12-alpine
          command: ["python3", "-I", "/setup/cloudflare-setup.py"]
          envFrom:
            - secretRef: {name: kd-staging-cloudflare}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: setup, mountPath: /setup, readOnly: true}
      volumes:
        - name: setup
          configMap: {name: cloudflare-setup}
