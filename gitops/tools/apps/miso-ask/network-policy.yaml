# In: only the homelab tls-gateway (Cilium envoy, entity "ingress"), i.e. internal for now;
# going public adds the Cloudflare tunnel (cloudflared pods in namespace cloudflare).
# Out: DNS, the two iso-lab MCP servers, and the homelab LLM gateway (llm-gateway, which alone reaches
# api.anthropic.com). Nothing else: no model downloads, no web, no version checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miso-ask
spec:
  endpointSelector:
    matchLabels: {app: miso-ask}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            app: litellm
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iso-lab
            iso-lab/role: mcp
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iso-lab
            iso-lab/role: analysis
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
