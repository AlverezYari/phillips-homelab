# Anthropic key: its own Console workspace with a spend limit (1Password miso-lab-anthropic).
# MCP token: the same bearer token the iso / iso-analysis MCP servers check (iso-lab item).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: miso-ask
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: miso-ask
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: miso-lab-anthropic, property: api_key}
    - secretKey: ISO_MCP_TOKEN
      remoteRef: {key: iso-lab, property: mcp_auth_token}
