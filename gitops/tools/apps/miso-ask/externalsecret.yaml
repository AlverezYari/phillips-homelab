# LLM key: this chat's key on the homelab LLM gateway (1Password llm-gateway, key_miso_ask); the gateway holds
# the Anthropic key and enforces this key's budget (llm-gateway/keys.json).
# MCP token: the same bearer token the iso / iso-analysis MCP servers check (iso-lab item).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # A new name (was miso-ask): the Argo app ignores /spec/data on ExternalSecrets (ESO's defaulted fields),
  # so a changed field on the old object never applied; a new object does (2026-10-10).
  name: miso-ask-llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: miso-ask-llm
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef: {key: llm-gateway, property: key_miso_ask}
    - secretKey: ISO_MCP_TOKEN
      remoteRef: {key: iso-lab, property: mcp_auth_token}
