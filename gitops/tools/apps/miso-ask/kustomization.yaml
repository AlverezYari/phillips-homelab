# miso-ask: https://miso-ask.phillips-homelab.net, the "ask the data" chat for the miso-lab demo
# (Open WebUI + Claude + the iso-lab MCP servers). INTERNAL for now (homelab tls-gateway +
# blocky). Everything it does is set in config/: settings.env (plain settings), entrypoint.py
# (connections, MCP servers, model defaults), system-prompt.md, prompt-suggestions.json.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: miso-ask
resources:
  - ask.yaml
  - externalsecret.yaml
  - network-policy.yaml
  - reference-grant.yaml
configMapGenerator:
  - name: miso-ask-settings
    envs:
      - config/settings.env
  - name: miso-ask-config
    files:
      - config/entrypoint.py
      - config/sync_models.py
      - config/system-prompt.md
      - config/prompt-suggestions.json
  # The skin: the lab's look and top bar for the chat (custom.css, loader.js, the lab's fonts).
  # sync_models.py copies these into /static once the server is up (Open WebUI rewrites /static at boot).
  - name: miso-ask-skin
    files:
      - skin/custom.css
      - skin/loader.js
      - skin/newsreader-latin-400-normal.woff2
      - skin/newsreader-latin-500-normal.woff2
      - skin/ibm-plex-mono-latin-400-normal.woff2
      - skin/ibm-plex-mono-latin-500-normal.woff2
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: miso-lab
