# Lets the shared tls-gateway's HTTPRoute https-app-route-17 (gitops core/apps/gateways.yml,
# miso-ask.phillips-homelab.net) reach the miso-ask Service, and nothing else here.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-routes
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: gateways
  to:
  - group: ""
    kind: Service
    name: miso-ask
