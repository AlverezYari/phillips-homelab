# loopctl conform runs a helper pod in `loops` as this SA. It applies and tears down the
# per-run stack here, so it gets namespace admin in kd-conformance and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conformance-runner
  namespace: loops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conformance-runner
  namespace: kd-conformance
subjects:
- kind: ServiceAccount
  name: conformance-runner
  namespace: loops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
