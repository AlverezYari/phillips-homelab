apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim
  namespace: valheim
  labels:
    app: valheim
  annotations:
    # Restart the server when the SERVER_PASS secret is rotated; env vars from
    # a secretRef are read once at container start and never refreshed.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Both PVCs are RWO. RollingUpdate would start the replacement pod before
  # tearing down the old one and deadlock on a multi-attach error.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valheim
  template:
    metadata:
      labels:
        app: valheim
    spec:
      # homelab-03 has the headroom and is one of the nodes the 1G L2
      # announcement policy covers, so the LB IP is announced from the same
      # node the pod runs on. Valheim needs ~150 kbps per player; 1G is ample.
      nodeSelector:
        kubernetes.io/hostname: homelab-03
      containers:
        - name: valheim
          image: ghcr.io/lloesche/valheim-server:latest
          ports:
            - name: game
              containerPort: 2456
              protocol: UDP
            - name: query
              containerPort: 2457
              protocol: UDP
            - name: status
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_NAME
              value: "Motherless Gentlemen"
            # Changing this generates a NEW world rather than renaming the old
            # one. "Midgard" was the throwaway used to prove out routing and
            # still sits in /config/worlds_local on the config PVC -- pointing
            # this back at it restores that world untouched.
            - name: WORLD_NAME
              value: "Motherless Gentlemen"
            - name: SERVER_PORT
              value: "2456"
            # false = not listed in the public community browser. Friends still
            # join via the crossplay join code printed in the pod log.
            - name: SERVER_PUBLIC
              value: "false"
            # Empty, i.e. no -crossplay. Under crossplay the server never binds
            # 2456 at all -- play is relayed through PlayFab Party via Azure
            # (eastus/eastus2), which flapped constantly: repeated "failed to
            # establish or maintain a connection" errors, lobby re-creation,
            # and a join code that changed on every reconnect. Everyone here is
            # on PC, so the Steam backend costs nothing in reach and takes the
            # relay out of the path. Restoring "-crossplay" reverts to relay
            # play and makes the LoadBalancer below inert.
            - name: SERVER_ARGS
              value: ""
            - name: SERVER_PASS
              valueFrom:
                secretKeyRef:
                  name: valheim-server
                  key: SERVER_PASS
            # Steam64 IDs, space separated, for /kick, /ban and console access.
            - name: ADMINLIST_IDS
              value: ""
            - name: UPDATE_CRON
              value: "0 5 * * *"
            - name: BACKUPS_CRON
              value: "0 * * * *"
            - name: BACKUPS_DIRECTORY
              value: "/config/backups"
            - name: BACKUPS_MAX_AGE
              value: "3"
            - name: STATUS_HTTP
              value: "true"
            - name: STATUS_HTTP_PORT
              value: "8080"
            - name: PERMISSIONS_UMASK
              value: "022"
            - name: TZ
              value: "America/Chicago"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: server
              mountPath: /opt/valheim
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          # Probing /status.json was wrong twice over: the status updater asks
          # A2S on 2457, which stays silent while -public 0, so it reports
          # TimeoutError permanently; and the httpd serving it is up ~10s after
          # container start, long before steamcmd has finished, so the pod went
          # Ready while still mid-download. The game binary is the honest
          # signal -- spawned only once the download completes, gone when the
          # server dies.
          #
          # First boot pulls ~2.1GB and generates the world, so allow 20
          # minutes before the pod is considered failed.
          startupProbe:
            exec:
              command: ["pgrep", "-f", "valheim_server.x86_64"]
            periodSeconds: 15
            failureThreshold: 80
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "valheim_server.x86_64"]
            periodSeconds: 15
          # Deliberately lenient: supervisor restarts the server process inside
          # the container, so give it ~5 minutes to recover on its own before
          # escalating to a pod restart that would re-run the whole boot.
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "valheim_server.x86_64"]
            periodSeconds: 30
            failureThreshold: 10
          # The image starts as root to run steamcmd and fix ownership, then
          # drops to its own unprivileged user via supervisor.
          securityContext:
            runAsUser: 0
      # World saves flush on shutdown; give the server room to finish so a
      # redeploy never costs progress.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: valheim-config
        - name: server
          persistentVolumeClaim:
            claimName: valheim-server
