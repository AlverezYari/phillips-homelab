apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: valheim-server
  namespace: valheim
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: valheim-server
    creationPolicy: Owner
  data:
  # Valheim rejects a password that is shorter than 5 characters or that
  # appears inside the server name or world name -- the server exits at boot
  # rather than starting unprotected. Keep those constraints in mind when
  # rotating the 1Password item.
  - secretKey: SERVER_PASS
    remoteRef:
      key: valheim-server
      property: server_pass
