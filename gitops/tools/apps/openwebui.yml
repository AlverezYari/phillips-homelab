apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://helm.openwebui.com
    chart: open-webui
    # 8.19.0 (app 0.6.41) -> 16.6.0 (app 0.11.4), 2026-10-08. Chart 9+ derives names from the
    # release ("openwebui-open-webui", "openwebui-ollama", ...); the fullnameOverrides below keep
    # the original names so the existing PVCs (chats, models) are reused, not replaced.
    targetRevision: "16.6.0"
    helm:
      values: |-
        replicaCount: 1
        fullnameOverride: open-webui

        image:
          repository: ghcr.io/open-webui/open-webui
          tag: ""
          pullPolicy: IfNotPresent

        nodeSelector:
          kubernetes.io/hostname: homelab-04

        service:
          type: ClusterIP
          port: 8080
          annotations:
            tailscale.com/expose: "true"

        ingress:
          enabled: false

        persistence:
          enabled: true
          storageClass: "syno-iscsi-default"
          accessModes:
            - ReadWriteOnce
          size: 20Gi

        resources:
          limits:
            memory: 4Gi
            cpu: 2000m
          requests:
            cpu: 1000m
            memory: 2Gi

        extraEnvFrom:
          - secretRef:
              name: openwebui-secrets

        # (The old extraEnvVars OLLAMA_BASE_URL=http://openwebui-ollama:11434 pointed at a Service
        # that didn't exist; the chart's own OLLAMA_BASE_URLS -> open-webui-ollama is what worked.)

        # Pipelines: off. Nothing was installed (its PVC held 20K, empty), and chart 16 changes
        # its Deployment selector, which is immutable. Re-enable with pipelines.enabled: true.
        pipelines:
          enabled: false

        ollama:
          enabled: true
          fullnameOverride: open-webui-ollama
          replicaCount: 1
          runtimeClassName: nvidia
          ollama:
            gpu:
              enabled: true
              type: nvidia
              number: 1
          nodeSelector:
            kubernetes.io/hostname: homelab-04
          persistentVolume:
            enabled: true
            storageClass: "syno-iscsi-default"
            size: 50Gi
          service:
            type: ClusterIP
          resources:
            limits:
              memory: 8Gi
              cpu: 4000m
              nvidia.com/gpu: 1
            requests:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
    
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true