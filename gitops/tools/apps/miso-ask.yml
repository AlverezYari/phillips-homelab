apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: miso-ask
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # miso-ask (https://miso-ask.phillips-homelab.net, internal): the demo's "ask the data" chat,
    # Open WebUI + Claude + the iso-lab MCP servers. After iso-lab (wave 1), whose MCP servers it
    # calls. Code + config: iso-market-data-lab deploy/k8s/miso-ask.
    argocd.argoproj.io/sync-wave: "3"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: miso-ask
  project: default
  # ESO defaults these fields server-side; without the ignore the app never reports Synced.
  ignoreDifferences:
  - group: external-secrets.io
    kind: ExternalSecret
    jsonPointers:
    - /spec/refreshInterval
    - /spec/target/deletionPolicy
    - /spec/data
  source:
    path: gitops/tools/apps/miso-ask
    repoURL: https://github.com/AlverezYari/phillips-homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
