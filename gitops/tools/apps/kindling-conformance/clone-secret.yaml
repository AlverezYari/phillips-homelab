# The Kindling build pod clones the PR ref from Forgejo with the loop-bot token (same
# 1Password item as loops/loop-secrets). Only FORGEJO_TOKEN is synced here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: conformance-clone
  namespace: kindling-conformance
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: conformance-clone
    creationPolicy: Owner
  data:
  - secretKey: FORGEJO_TOKEN
    remoteRef:
      key: loop-rig
      property: forgejo-token
