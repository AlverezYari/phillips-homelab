# The gateway's own Postgres (CNPG): virtual keys, budgets and the spend log. Small; losing it loses spend
# history and the keys' running spend, not the keys themselves (sync_keys.py recreates them from git).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: llm-gateway-pg
spec:
  instances: 1
  storage:
    storageClass: syno-iscsi-default
    size: 5Gi
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      secret:
        name: llm-gateway-pg
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
