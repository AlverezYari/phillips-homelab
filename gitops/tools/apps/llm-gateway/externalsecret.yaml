# 1Password item llm-gateway (vault phillips-homelab): master_key, pg_password, key_miso_api_ask, key_miso_ask
# (keys start with sk-). The Anthropic key: the existing miso-lab-anthropic item, now held only here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-pg
spec:
  secretStoreRef: {kind: ClusterSecretStore, name: staging}
  target:
    name: llm-gateway-pg
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: litellm
        password: "{{ .pg_password }}"
  data:
    - secretKey: pg_password
      remoteRef: {key: llm-gateway, property: pg_password}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: staging}
  target:
    name: llm-gateway
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ANTHROPIC_API_KEY: "{{ .anthropic }}"
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        DATABASE_URL: "postgresql://litellm:{{ .pg_password }}@llm-gateway-pg-rw:5432/litellm"
        KEY_MISO_API_ASK: "{{ .key_miso_api_ask }}"
        KEY_MISO_ASK: "{{ .key_miso_ask }}"
  data:
    - {secretKey: anthropic, remoteRef: {key: miso-lab-anthropic, property: api_key}}
    - {secretKey: master_key, remoteRef: {key: llm-gateway, property: master_key}}
    - {secretKey: pg_password, remoteRef: {key: llm-gateway, property: pg_password}}
    - {secretKey: key_miso_api_ask, remoteRef: {key: llm-gateway, property: key_miso_api_ask}}
    - {secretKey: key_miso_ask, remoteRef: {key: llm-gateway, property: key_miso_ask}}
---
# The Admin UI's sign-in (UI_USERNAME / UI_PASSWORD): fields ui_username and ui_password on the llm-gateway item.
# Its own object: the Argo app ignores /spec/data on ExternalSecrets, so adding fields to llm-gateway above would
# never apply (2026-10-10).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-ui
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: staging}
  target:
    name: llm-gateway-ui
    creationPolicy: Owner
  data:
    - {secretKey: UI_USERNAME, remoteRef: {key: llm-gateway, property: ui_username}}
    - {secretKey: UI_PASSWORD, remoteRef: {key: llm-gateway, property: ui_password}}
---
# MCP: the lab MCP servers' bearer token (iso-lab item, mcp_auth_token), held only by the gateway now. Its own
# object: the Argo app ignores /spec/data on ExternalSecrets, so fields added to llm-gateway above would never
# apply (2026-10-10).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-mcp
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: staging}
  target:
    name: llm-gateway-mcp
    creationPolicy: Owner
  data:
    - {secretKey: ISO_MCP_TOKEN, remoteRef: {key: iso-lab, property: mcp_auth_token}}
---
# Claude Code's gateway key (llm-gateway item, key_claude_code). Separate from the MCP token, so a missing field
# here can't take the MCP servers down (one missing field fails a whole ExternalSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-claude-code
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: staging}
  target:
    name: llm-gateway-claude-code
    creationPolicy: Owner
  data:
    - {secretKey: KEY_CLAUDE_CODE, remoteRef: {key: llm-gateway, property: key_claude_code}}
