# LiteLLM proxy: every model call in the homelab goes through here (spend per key, budgets, limits, routing).
# Keys and their budgets: keys.json (synced by sync_keys.py). The lab-wide cap is max_budget below.
#
# Prices are pinned here (USD per token), not looked up: LiteLLM fetches its price list from GitHub at start,
# which the network policy blocks, and the list built into v1.104.2 doesn't know claude-sonnet-5-5, so every
# call cost $0 and no budget counted (2026-10-10). Source: BerriAI/litellm model_prices_and_context_window.json.
model_list:
  - model_name: claude-sonnet-5-5
    litellm_params: {model: anthropic/claude-sonnet-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 0.0000001
  - model_name: claude-opus-5-5
    litellm_params: {model: anthropic/claude-opus-5-5, api_key: os.environ/ANTHROPIC_API_KEY}
    model_info:
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_creation_input_token_cost: 0.000005
      cache_read_input_token_cost: 0.0000002
# MCP: the lab's two MCP servers behind the gateway. Clients connect to /mcp/ (or /mcp/<server>) with their own
# gateway key, which lists the servers it may use (keys.json); only the gateway holds the servers' bearer token.
# Tool names come out "<server>_<tool>" (MCP_TOOL_PREFIX_SEPARATOR=_), so server names can't contain "_".
mcp_servers:
  iso:
    url: "http://mcp-clickhouse.iso-lab.svc.cluster.local/mcp"
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/ISO_MCP_TOKEN
    description: "MISO lab: read-only SQL on ClickHouse (iso_ro, 30 s / 100k rows)"
  analysis:
    url: "http://iso-analysis.iso-lab.svc.cluster.local/mcp"
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/ISO_MCP_TOKEN
    description: "MISO lab: fixed analysis tools (rollup, regression, cointegration, anomaly, seasonality)"
litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false  # the network policy admits only the metrics scraper and the consumers
  max_budget: 150          # USD, everything through the gateway, per budget_duration: past it, every call is refused
  budget_duration: 30d
  drop_params: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
