# Pinnacle NFL game-lines ingest CronJob (tipoff issue #14, PR 1).
#
# Same job as cronjob-pinnacle.yaml with --sport nfl (Pinnacle league
# 889). Feeds Breaker Bowl's sim. NFL lines move far slower than the
# NBA slate, so */15 is plenty for now; issue #14 PR 3 replaces this
# with an NFL-shaped schedule (hourly Tue-Sat, tighter Sunday morning).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tipoff-ingest-pinnacle-nfl
  labels:
    app.kubernetes.io/name: tipoff-ingest-pinnacle-nfl
    app.kubernetes.io/component: ingest
    tipoff.io/source: pinnacle
    tipoff.io/sport: nfl
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tipoff-ingest-pinnacle-nfl
            tipoff.io/source: pinnacle
        spec:
          restartPolicy: OnFailure
          containers:
            - name: feed
              image: tipoff   # rewritten by kustomization.yaml
              args: ["ingest", "pinnacle", "--sport", "nfl"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tipoff-pg-app
                      key: uri
                - name: LOG_LEVEL
                  value: info
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532       # distroless `nonroot` UID — needed for runAsNonRoot verification under PSS restricted
                runAsGroup: 65532
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
