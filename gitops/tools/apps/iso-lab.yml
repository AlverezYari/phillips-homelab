apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iso-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After iso-lab-db (wave 0) so the namespace and Postgres exist; before
    # iso-lab-dagster (wave 2), which needs the secrets and ClickHouse.
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: iso-lab
  project: default
  # ESO defaults these fields server-side; without the ignore the app never reports Synced.
  ignoreDifferences:
  - group: external-secrets.io
    kind: ExternalSecret
    jsonPointers:
    - /spec/refreshInterval
    - /spec/target/deletionPolicy
    - /spec/data
  # The API server fills in apiVersion/kind/volumeMode/status on volumeClaimTemplates,
  # which are immutable anyway (same as garage.yml).
  - group: apps
    kind: StatefulSet
    name: clickhouse
    jsonPointers:
    - /spec/volumeClaimTemplates
  source:
    path: gitops/tools/apps/iso-lab
    repoURL: https://github.com/AlverezYari/phillips-homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
