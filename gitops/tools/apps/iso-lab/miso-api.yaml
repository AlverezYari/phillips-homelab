# miso-api: the MISO Lab read API behind the portal's Home (and the Terminal next): named queries with
# provenance (query id, params, rows read, time, SQL hash, literal rerun SQL), ad-hoc SQL with ch-lint,
# data status from Dagster's asset checks. Code: iso_lab.api in the iso-lab image (same tag as the
# Dagster code server). Named queries as iso_ro, ad-hoc SQL as iso_console (the portal console's user
# and limits), Dagster through the read-only webserver. The one write: the paper desk appends orders
# to ClickHouse database desk as iso_desk (desk.* only; it cannot touch iso.*). Ask the data (iso_lab.api.ask):
# Claude through the homelab's LLM gateway (llm-gateway, LiteLLM: its own key, budget and limits), its
# tools the same read-only SQL as iso_console and the iso-analysis functions.
# Network: the miso-lab gateway in; ClickHouse, the read-only webserver and the LLM gateway out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miso-api
  labels:
    app.kubernetes.io/name: miso-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miso-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miso-api
        iso-lab/role: api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: iso-lab  # rewritten by kustomization.yaml (same tag as the Dagster code server)
          command: ["python", "-m", "iso_lab.api.server"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: CLICKHOUSE_HOST, value: clickhouse}
            - {name: CLICKHOUSE_PORT, value: "8123"}
            - {name: CLICKHOUSE_USER, value: iso_ro}
            - {name: CONSOLE_USER, value: iso_console}  # same password as iso_ro (clickhouse/users.xml)
            - {name: DESK_USER, value: iso_desk}  # paper desk writer: desk.* only, same password (clickhouse/users.xml)
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: iso-lab-mcp, key: CLICKHOUSE_PASSWORD}}
            - {name: DAGSTER_GRAPHQL_URL, value: "http://dagster-webserver-read-only/dagster/graphql"}
            # Ask: Anthropic's SDK pointed at the LLM gateway, with this consumer's own gateway key
            - {name: ANTHROPIC_BASE_URL, value: "http://litellm.llm-gateway.svc.cluster.local:4000"}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: miso-api-llm, key: ANTHROPIC_API_KEY}}  # new name: never the old Anthropic key
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: miso-api
  labels:
    app.kubernetes.io/name: miso-api
spec:
  selector:
    app.kubernetes.io/name: miso-api
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: iso-lab-miso-api
spec:
  endpointSelector:
    matchLabels:
      iso-lab/role: api
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miso-lab
            app: miso-lab-gateway
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:  # the LLM gateway (Ask's model calls)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            app: litellm
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: clickhouse
      toPorts:
        - ports: [{port: "8123", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            component: dagster-webserver-read-only
      toPorts:
        - ports: [{port: "80", protocol: TCP}]
