# MCP server for the LLM: ClickHouse's official mcp-clickhouse (tools: run_query,
# list_databases, list_tables), unmodified, image built from the pinned PyPI release
# (deploy/mcp-clickhouse/Dockerfile in the code repo).
#
# Guardrails, outermost first: bearer token (CLICKHOUSE_MCP_AUTH_TOKEN) -> server's
# read-only mode (CLICKHOUSE_ALLOW_WRITE_ACCESS defaults false) -> ClickHouse user
# iso_ro (readonly=1, SELECT on iso.* only, no lake/s3 access, 30s / 100k rows /
# 2 GB caps; clickhouse/users.xml) -> network policy (this pod reaches ClickHouse only).
#
# Served at https://iso-mcp.phillips-homelab.net/mcp (LAN, shared tls-gateway), and in-cluster to the
# LLM gateway (llm-gateway, LiteLLM: MCP server "iso") at mcp-clickhouse.iso-lab.svc.cluster.local, which
# fronts it for the raw chat and Claude Code with per-key access.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iso-lab-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: iso-lab-mcp
    creationPolicy: Owner
  data:
  # Own ExternalSecret so a missing 1Password field can't break iso-lab-env's sync.
  - secretKey: CLICKHOUSE_MCP_AUTH_TOKEN
    remoteRef: {key: iso-lab, property: mcp_auth_token}
  - secretKey: CLICKHOUSE_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_ro_password}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-clickhouse
  labels:
    app.kubernetes.io/name: mcp-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-clickhouse
        iso-lab/role: mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: zot.phillips-homelab.net/mcp-clickhouse:0.7.0
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: CLICKHOUSE_HOST, value: clickhouse}
            - {name: CLICKHOUSE_PORT, value: "8123"}
            - {name: CLICKHOUSE_SECURE, value: "false"}
            - {name: CLICKHOUSE_USER, value: iso_ro}
            - {name: CLICKHOUSE_DATABASE, value: iso}
            - {name: CLICKHOUSE_MCP_QUERY_TIMEOUT, value: "30"}
            # Host header the server answers for (required when bound to 0.0.0.0).
            - {name: CLICKHOUSE_MCP_ALLOWED_HOSTS, value: "iso-mcp.phillips-homelab.net,mcp-clickhouse.iso-lab.svc.cluster.local"}
          envFrom:
            - secretRef:
                name: iso-lab-mcp
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-clickhouse
  labels:
    app.kubernetes.io/name: mcp-clickhouse
spec:
  selector:
    app.kubernetes.io/name: mcp-clickhouse
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Ingress only from the shared gateway (Cilium's envoy = reserved:ingress) and the LLM gateway
# (llm-gateway, same bearer token); egress only
# to ClickHouse's HTTP port. No internet, no lake, no Postgres.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: iso-lab-mcp
spec:
  endpointSelector:
    matchLabels:
      iso-lab/role: mcp
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
    - fromEndpoints:  # the LLM gateway, which fronts these MCP servers for the raw chat and Claude Code
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm-gateway
            app: litellm
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: clickhouse
      toPorts:
        - ports: [{port: "8123", protocol: TCP}]
