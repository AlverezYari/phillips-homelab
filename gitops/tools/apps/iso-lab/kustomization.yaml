# iso-lab core: ClickHouse (serving store), secrets, network policy,
# gateway grant. Dagster itself is the Helm chart in argocd/iso-lab-dagster.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iso-lab
resources:
  - externalsecret.yaml
  - clickhouse-statefulset.yaml
  - clickhouse-service.yaml
  - reference-grant.yaml
  - mcp-clickhouse.yaml
  - iso-analysis.yaml
  - miso-api.yaml
  - network-policy.yaml
  - vmpodscrape-clickhouse.yaml
  # - vmrule.yaml   # PAUSED 2026-10-14: off while scaled to zero (stale-poll/scrape-down would fire)
  - dagster-webserver-readonly.yaml
  - vmalertmanagerconfig-ntfy.yaml
# Same image and tag as the Dagster code server (../iso-lab-dagster.yml); bump both.
images:
  - name: iso-lab
    newName: zot.phillips-homelab.net/iso-lab
    newTag: "f4fcddf"
# PAUSED 2026-10-14: the demo window closed. Data stays (PVCs, lake, Postgres); to resume,
# revert the PR that added the replicas: 0 block below.
replicas:
  - {name: clickhouse, count: 0}
  - {name: mcp-clickhouse, count: 0}
  - {name: iso-analysis, count: 0}
  - {name: miso-api, count: 0}
  - {name: dagster-webserver-read-only, count: 0}
configMapGenerator:
  - name: clickhouse-config
    files:
      - clickhouse/lake.xml
      - clickhouse/users.xml
      - clickhouse/logger.xml
      - clickhouse/prometheus.xml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: iso-lab
