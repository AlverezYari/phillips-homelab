# Tailnet access via the tailscale-operator proxy (same mechanism as
# stock-bot-dash). Separate Services so the Helm chart's own Services stay
# untouched by the operator.
apiVersion: v1
kind: Service
metadata:
  name: iso-dagster-tailnet
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: iso-dagster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: dagster
    component: dagster-webserver
  ports:
    - {name: http, port: 80, targetPort: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: iso-clickhouse-tailnet
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: iso-clickhouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - {name: http, port: 8123, targetPort: http}
