# Lets the shared tls-gateway's HTTPRoutes (gitops/core/apps/gateways.yml:
# https-13 -> dagster.phillips-homelab.net, https-14 -> iso-mcp.phillips-homelab.net,
# https-15 -> iso-analysis.phillips-homelab.net)
# reach these Services in this namespace, and nothing else here.
# Lives here rather than in gateways.yml (where the other grants are) because
# this namespace is created by iso-lab-db: a grant in gateways.yml would fail
# the core sync until iso-lab-db had run.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-routes
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: gateways
  to:
  - group: ""
    kind: Service
    name: dagster-dagster-webserver
  - group: ""
    kind: Service
    name: mcp-clickhouse
  - group: ""
    kind: Service
    name: iso-analysis
