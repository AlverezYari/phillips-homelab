# Lets the shared tls-gateway's HTTPRoute (gitops/core/apps/gateways.yml,
# https-13 -> dagster.phillips-homelab.net) reach Services in this namespace.
# Lives here rather than in gateways.yml (where the other grants are) because
# this namespace is created by iso-lab-db: a grant in gateways.yml would fail
# the core sync until iso-lab-db had run.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-routes
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: gateways
  to:
  - group: ""
    kind: Service
    name: dagster-dagster-webserver
