# Single-node ClickHouse. Rebuildable from the Parquet lake at any time, so
# one replica on iSCSI is fine: losing the PVC costs a reload, not data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      # Prefer homelab-04: off the control-plane node (etcd shares homelab-01's NVMe).
      # Data lives on the iSCSI PVC, so the pod can move; preferred, not required.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [homelab-04]}
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch  # don't re-chown 50Gi on every restart
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.9
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            - name: LAKE_S3_ENDPOINT_FOR_CH
              value: http://garage.garage.svc:3900/iso-market-data/
          # Read-only lake key + ClickHouse user passwords only (not the pipeline's
          # read/write lake key in iso-lab-env).
          envFrom:
            - secretRef:
                name: iso-lab-clickhouse
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
            - {name: metrics, containerPort: 9363}
          startupProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # 4Gi wasn't enough for the history marts' first build: two concurrent incremental
          # inserts over ~7.5M rows each hit ClickHouse's server cap (90% of the limit) with
          # Code 241. homelab-04 has 64 GB; big GROUP BYs also spill to disk (users.xml).
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: logs, mountPath: /var/log/clickhouse-server}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/logger.xml, subPath: logger.xml}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/lake.xml, subPath: lake.xml}
            - {name: config, mountPath: /etc/clickhouse-server/config.d/prometheus.xml, subPath: prometheus.xml}
            - {name: config, mountPath: /etc/clickhouse-server/users.d/users.xml, subPath: users.xml}
      volumes:
        - name: logs
          emptyDir: {sizeLimit: 256Mi}  # console logging; kept for anything that still writes here
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: syno-iscsi-default
        resources:
          requests:
            storage: 50Gi
