# Pipeline secret: lake read/write key (Garage key iso-lab, used by dlt) and the
# ClickHouse `iso` password (dbt, freshness checks). Mounted by the Dagster code server.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iso-lab-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: iso-lab-env
    creationPolicy: Owner
  data:
  - secretKey: LAKE_ACCESS_KEY_ID
    remoteRef: {key: iso-lab, property: garage_access_key_id}
  - secretKey: LAKE_SECRET_ACCESS_KEY
    remoteRef: {key: iso-lab, property: garage_secret_access_key}
  - secretKey: CLICKHOUSE_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_password}
---
# ClickHouse's own secret. It reads the lake through Garage key iso-lab-clickhouse-ro
# (read only): it can rebuild every table from the lake but can't add, change or delete
# lake objects, even as the full-access `iso` user via s3()/INSERT INTO FUNCTION.
# Env names match clickhouse/lake.xml (from_env) and clickhouse/users.xml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iso-lab-clickhouse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: iso-lab-clickhouse
    creationPolicy: Owner
  data:
  - secretKey: LAKE_ACCESS_KEY_ID
    remoteRef: {key: iso-lab, property: garage_ro_access_key_id}
  - secretKey: LAKE_SECRET_ACCESS_KEY
    remoteRef: {key: iso-lab, property: garage_ro_secret_access_key}
  - secretKey: CLICKHOUSE_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_password}
  - secretKey: CLICKHOUSE_RO_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_ro_password}

---
# Ask the data (miso-api): the same Anthropic key and Console workspace as the miso-ask chat (1Password
# miso-lab-anthropic), so one spend limit covers both.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: miso-api-anthropic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: miso-api-anthropic
    creationPolicy: Owner
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef: {key: miso-lab-anthropic, property: api_key}
