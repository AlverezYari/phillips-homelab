# Lake (Garage key iso-lab, bucket iso-market-data) and ClickHouse user
# passwords, from the 1Password item `iso-lab`. Mounted by ClickHouse and by
# the Dagster user-code pods (env names match iso_lab.resources).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iso-lab-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: iso-lab-env
    creationPolicy: Owner
  data:
  - secretKey: LAKE_ACCESS_KEY_ID
    remoteRef: {key: iso-lab, property: garage_access_key_id}
  - secretKey: LAKE_SECRET_ACCESS_KEY
    remoteRef: {key: iso-lab, property: garage_secret_access_key}
  - secretKey: CLICKHOUSE_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_password}
  - secretKey: CLICKHOUSE_RO_PASSWORD
    remoteRef: {key: iso-lab, property: clickhouse_ro_password}
