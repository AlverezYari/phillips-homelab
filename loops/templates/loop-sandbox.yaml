# Per-loop Sandbox manifest. The conductor instantiates this per loop:
#   LOOP=myloop REPO=loop-bot/myrepo envsubst < loop-sandbox.yaml | kubectl apply -f -
# then uploads the SPEC:
#   kubectl -n loops cp SPEC.md ${LOOP}:/workspace/SPEC.md
# (Direct Sandbox, no warm pool: per-loop env like REPO_URL must be set at
# pod creation, and Pro rate limits mean one loop at a time anyway.)
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: ${LOOP}
  namespace: loops
  labels:
    loop.phillips.dev/state: starting
spec:
  shutdownPolicy: Retain
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: nvme-scratch
      resources:
        requests:
          storage: 10Gi
  podTemplate:
    spec:
      runtimeClassName: gvisor
      serviceAccountName: loop-runner
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: homelab-04
      restartPolicy: OnFailure
      containers:
      - name: loop
        # default-image-tag: 260809-codex2
        # (bump via PR; loopctl spawn --image TAG substitutes at render
        # time — a patch after apply races the already-started pod and
        # the pod keeps the old image, same trap as GATE_CMD below.)
        image: zot.phillips-homelab.net/loop-dev:${IMAGE}
        envFrom:
        - secretRef:
            name: loop-secrets
        # codex-auth exists only if the conductor has seeded it
        # (kubectl -n loops create secret generic codex-auth
        #    --from-file=CODEX_AUTH_JSON=$HOME/.codex/auth.json);
        # optional so claude-engine loops never depend on it.
        - secretRef:
            name: codex-auth
            optional: true
        env:
        - name: LOOP_NAME
          value: ${LOOP}
        - name: REPO_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000/${REPO}.git
        - name: MEMORY_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000/loop-bot/memory.git
        - name: MAX_ITER
          value: "${MAX_ITER}"
        - name: ENGINE
          value: ${ENGINE}
        # GATE_CMD must be set at pod creation: a patch after apply
        # races the already-started pod and silently never applies
        # (the first codex smoke ran the full default gate for exactly
        # this reason). loopctl substitutes the harness default when
        # --gate is not given.
        - name: GATE_CMD
          value: "${GATE}"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "4"
            memory: 6Gi
